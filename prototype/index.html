<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>热量日历 · 原型</title>
<style>
:root{
  --bg:#0B0D10; --surface:#16191F; --surface2:#1E222A; --surface3:#262B35;
  --line:rgba(255,255,255,.075); --text:#F2F4F8; --muted:#8A92A3; --muted2:#5E6678;
  --accent:#FF7A45; --accent2:#FFB088; --ok:#2ED3B7; --over:#FF5F6D; --warn:#FFC24B;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1100px 700px at 15% -10%, #171B23 0%, #0B0D10 55%, #08090C 100%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px 16px;gap:26px;}
.side{max-width:250px;color:var(--muted);font-size:12px;line-height:1.85;display:none;}
.side h4{color:var(--text);font-size:13px;margin:0 0 8px;letter-spacing:.04em;}
.side b{color:var(--accent2);font-weight:600;}
.phone{
  position:relative;width:390px;height:min(812px,calc(100vh - 44px));
  background:var(--bg);border-radius:42px;overflow:hidden;
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 40px 90px -20px rgba(0,0,0,.85), 0 0 0 9px #101317, 0 0 0 10px rgba(255,255,255,.06);
  display:flex;flex-direction:column;
}
@media(min-width:1180px){ .side{display:block;} }
@media(max-width:460px){
  .stage{padding:0;}
  .phone{width:100%;height:100vh;border-radius:0;border:none;box-shadow:none;}
}
/* 状态栏 */
.sbar{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;font-size:13px;font-weight:600;letter-spacing:.02em;color:#fff;position:relative;z-index:5;}
.sbar .r{display:flex;align-items:center;gap:5px;opacity:.9;}
/* 应用主体 */
.app{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;}
.app::-webkit-scrollbar{display:none;}
.page{padding:0 16px 100px;animation:fade .22s ease both;}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
/* 顶部 */
.head{display:flex;align-items:flex-start;justify-content:space-between;padding:6px 2px 14px;}
.head .d1{font-size:12px;color:var(--muted);letter-spacing:.06em;}
.head .d2{font-size:22px;font-weight:700;margin-top:3px;letter-spacing:-.01em;}
.mchip{display:flex;align-items:center;gap:7px;background:var(--surface2);border:1px solid var(--line);
  border-radius:99px;padding:6px 12px 6px 7px;font-size:12.5px;font-weight:600;cursor:pointer;
  transition:.15s;white-space:nowrap;}
.mchip:active{transform:scale(.96);}
.mav{width:22px;height:22px;border-radius:99px;display:grid;place-items:center;font-size:12px;
  background:linear-gradient(140deg,#FF9A62,#FF5F6D);}
/* 环形卡 */
.ring-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 18px 14px;
  position:relative;overflow:hidden;}
.ring-card::after{content:"";position:absolute;width:220px;height:220px;right:-90px;top:-110px;border-radius:99px;
  background:radial-gradient(circle,rgba(255,122,69,.16),transparent 68%);pointer-events:none;}
.ring-wrap{display:flex;align-items:center;gap:16px;position:relative;}
.ring{position:relative;width:126px;height:126px;flex:0 0 126px;}
.ring svg{transform:rotate(-90deg);display:block;}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
.ring .big{font-size:29px;font-weight:800;letter-spacing:-.03em;line-height:1;}
.ring .unit{font-size:10.5px;color:var(--muted);letter-spacing:.1em;margin-top:4px;}
.ring .lab{font-size:10.5px;color:var(--muted);margin-bottom:3px;letter-spacing:.08em;}
.rr{flex:1;min-width:0;}
.rr .row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;}
.rr .row span:first-child{color:var(--muted);}
.rr .row span:last-child{font-weight:650;font-variant-numeric:tabular-nums;}
.rr .bar{height:5px;border-radius:99px;background:var(--surface3);margin:9px 0 7px;overflow:hidden;}
.rr .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FF9A62,#FF5F6D);transition:width .5s;}
.rr .hint{font-size:11.5px;color:var(--muted);line-height:1.5;}
/* 分区标题 */
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px;}
.sec h3{font-size:13px;margin:0;letter-spacing:.05em;color:var(--muted);font-weight:600;}
.sec .act{font-size:12px;color:var(--accent);font-weight:600;cursor:pointer;}
/* 餐次卡 */
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden;}
.meal-h{display:flex;align-items:center;gap:10px;padding:13px 14px;}
.meal-h .ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:15px;background:var(--surface3);}
.meal-h .nm{font-size:14px;font-weight:650;flex:1;}
.meal-h .kk{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600;}
.meal-h .kk b{color:var(--text);font-weight:700;}
.items{border-top:1px solid var(--line);}
.item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.045);}
.item:last-child{border-bottom:none;}
.item .ie{font-size:15px;width:22px;text-align:center;}
.item .in{flex:1;min-width:0;}
.item .in .n{font-size:13.5px;font-weight:550;}
.item .in .p{font-size:10.5px;color:var(--muted2);margin-top:2px;letter-spacing:.03em;}
.item .ik{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
.addbtn{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;font-size:13px;
  color:var(--accent);font-weight:600;cursor:pointer;border-top:1px solid var(--line);}
.addbtn:active{background:rgba(255,122,69,.07);}
.empty{padding:16px 14px;font-size:12.5px;color:var(--muted2);border-top:1px solid var(--line);}
/* 底部 Tab */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:76px;padding-bottom:14px;
  background:linear-gradient(to top,rgba(11,13,16,.98) 55%,rgba(11,13,16,.86));
  backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;align-items:center;z-index:8;}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:8px;cursor:pointer;
  color:var(--muted2);font-size:10.5px;font-weight:600;transition:.15s;letter-spacing:.02em;}
.tb.on{color:var(--accent);}
.tb svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;}
/* 日历 */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 16px;}
.calhead .m{font-size:19px;font-weight:750;letter-spacing:-.02em;}
.calhead .m span{font-size:11px;color:var(--muted);font-weight:600;margin-left:6px;}
.navb{width:30px;height:30px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);
  display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:13px;}
.navb:active{background:var(--surface3);}
.wk{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px;}
.wk div{text-align:center;font-size:10.5px;color:var(--muted2);font-weight:600;letter-spacing:.06em;}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.cell{aspect-ratio:1/1.18;border-radius:11px;background:var(--surface);border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 2px 5px;
  cursor:pointer;position:relative;transition:.14s;}
.cell.blank{background:transparent;pointer-events:none;}
.cell .dn{font-size:11.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;}
.cell .k{font-size:9.5px;font-weight:700;margin-top:auto;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.cell .pip{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:24px;height:2.5px;border-radius:9px;background:var(--surface3);}
.cell.has .dn{color:var(--text);}
.cell.under{background:rgba(46,211,183,.09);border-color:rgba(46,211,183,.22);}
.cell.under .k{color:var(--ok);}
.cell.over{background:rgba(255,95,109,.1);border-color:rgba(255,95,109,.26);}
.cell.over .k{color:var(--over);}
.cell.near{background:rgba(255,194,75,.09);border-color:rgba(255,194,75,.22);}
.cell.near .k{color:var(--warn);}
.cell.today{border-color:var(--accent)!important;box-shadow:0 0 0 1.5px rgba(255,122,69,.35) inset;}
.cell.today .dn{color:var(--accent);}
/* 按下反馈不要改变元素几何尺寸：格子密集时缩小会让"按下点"落到格子外，
   浏览器会把 click 派发给共同祖先（.grid），表现为点边缘没反应 */
.cell:active{background:var(--surface3);border-color:var(--line);}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:14px 2px 0;font-size:10.5px;color:var(--muted2);}
.legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:5px;vertical-align:middle;}
/* 月结 */
.mstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;}
.mstat .c{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 10px;text-align:center;}
.mstat .v{font-size:18px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.mstat .l{font-size:10px;color:var(--muted2);margin-top:4px;letter-spacing:.05em;}
/* 柱状图（带 Y 轴刻度 + 目标参考线） */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px 10px;margin-top:16px;}
.chart .plotwrap{display:flex;}
.chart .yaxis{position:relative;flex:0 0 34px;width:34px;height:104px;}
.chart .yaxis .yt{position:absolute;right:7px;font-size:9px;line-height:1;color:var(--muted2);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;transform:translateY(50%);}
.chart .yaxis .yt.goal{color:var(--warn);font-weight:700;}
.chart .plot{position:relative;flex:1;height:104px;}
.chart .plot .gl{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.1);}
.chart .plot .gl.zero{background:rgba(255,255,255,.2);}
.chart .plot .goalline{position:absolute;left:0;right:0;border-top:1px dashed var(--warn);opacity:.65;z-index:2;}
.chart .cols{position:relative;display:flex;align-items:flex-end;gap:8px;height:100%;z-index:1;}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;}
.chart .col .b{width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:var(--surface3);
  min-height:3px;transition:height .5s cubic-bezier(.2,.8,.3,1);position:relative;}
/* 没记录的日子用贴底短横线表示。之前画成小方块，看着像"热量很低的柱子"，会误导。 */
.chart .col .nodata{display:block;width:64%;max-width:18px;height:3px;border-radius:3px;
  background:rgba(255,255,255,.14);}
.chart .col .b.under{background:linear-gradient(180deg,#2ED3B7,#1F9E88);}
.chart .col .b.over{background:linear-gradient(180deg,#FF7A45,#FF5F6D);}
.chart .col .b.near{background:linear-gradient(180deg,#FFC24B,#E8A227);}
.chart .xlabels{display:flex;gap:8px;margin-top:7px;}
.chart .xlabels span{flex:1;text-align:center;font-size:9.5px;color:var(--muted2);}
/* 体重卡片 */
.wcard{padding:15px 14px 12px;}
.wtop{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;}
.wtop .wnum{font-size:23px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.wtop .wnum i{font-size:11px;font-weight:600;color:var(--muted2);margin-left:3px;font-style:normal;}
.wtop .wdlt{font-size:11px;font-weight:650;font-variant-numeric:tabular-nums;}
.wtop .wdlt.down{color:var(--ok);}
.wtop .wdlt.up{color:var(--over);}
.wtop .wdlt.flat{color:var(--muted2);}
.wx{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted2);margin-top:6px;
  padding-left:30px;padding-right:6px;}
.wempty{font-size:12px;color:var(--muted2);text-align:center;padding:26px 8px;line-height:1.8;}
/* 体重历史列表（弹层内） */
.wrow{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--surface2);
  border-radius:11px;margin-bottom:5px;}
.wrow .d{font-size:11px;color:var(--muted2);width:44px;font-variant-numeric:tabular-nums;}
.wrow .k{flex:1;font-size:13.5px;font-weight:650;font-variant-numeric:tabular-nums;}
.wrow .x{font-size:15px;color:var(--muted2);padding:0 3px;cursor:pointer;}
.wrow .x:active{color:var(--over);}
/* 面板 sheet */
.mask{position:absolute;inset:0;background:rgba(0,0,0,.44);backdrop-filter:blur(1.5px);z-index:20;
  display:flex;align-items:flex-end;animation:fadein .18s ease both;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{width:100%;background:var(--surface);border-radius:26px 26px 0 0;border-top:1px solid rgba(255,255,255,.1);
  max-height:88%;display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.85,.3,1) both;}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sh-h{padding:8px 18px 12px;border-bottom:1px solid var(--line);flex:0 0 auto;position:relative;}
.sh-h .grab{width:36px;height:4px;border-radius:9px;background:var(--surface3);margin:0 auto 12px;}
.sh-h .t{font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px;}
.sh-h .s{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5;}
.sh-h .x{position:absolute;right:14px;top:14px;width:28px;height:28px;border-radius:99px;background:var(--surface3);
  display:grid;place-items:center;font-size:15px;color:var(--muted);cursor:pointer;}
.sh-b{overflow-y:auto;padding:16px 18px;flex:1;scrollbar-width:none;}
.sh-b::-webkit-scrollbar{display:none;}
.sh-f{padding:12px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  display:flex;gap:10px;flex:0 0 auto;background:var(--surface);}
.btn{flex:1;padding:13px;border-radius:13px;border:none;font-size:14px;font-weight:700;cursor:pointer;
  font-family:inherit;transition:.15s;}
.btn:active{transform:scale(.98);}
.btn.pri{background:linear-gradient(135deg,#FF9A62,#FF5F6D);color:#fff;box-shadow:0 8px 22px -8px rgba(255,95,109,.55);}
.btn.gho{background:var(--surface3);color:var(--text);}
.btn:disabled{opacity:.45;}
/* 拍照 */
.cam{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cam .opt{background:var(--surface2);border:1px dashed rgba(255,255,255,.16);border-radius:15px;
  padding:26px 10px;text-align:center;cursor:pointer;transition:.15s;}
.cam .opt:active{background:var(--surface3);border-color:var(--accent);}
.cam .opt .i{font-size:24px;}
.cam .opt .t{font-size:12.5px;font-weight:650;margin-top:9px;}
.tips{background:var(--surface2);border-radius:12px;padding:11px 13px;font-size:11.5px;
  color:var(--muted);line-height:1.65;margin-top:14px;}
.tips b{color:var(--accent2);}
.preview{width:100%;border-radius:15px;display:block;max-height:190px;object-fit:cover;background:var(--surface3);}
.scan{display:flex;align-items:center;gap:11px;margin-top:14px;font-size:12.5px;color:var(--muted);}
.spin{width:17px;height:17px;border-radius:99px;border:2px solid var(--surface3);border-top-color:var(--accent);
  animation:sp .7s linear infinite;flex:0 0 17px;}
@keyframes sp{to{transform:rotate(360deg)}}
.pbar{height:3px;border-radius:9px;background:var(--surface3);overflow:hidden;margin-top:11px;}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#FF9A62,#FF5F6D);width:0;transition:width .4s;}
/* 识别结果行 */
.ritem{background:var(--surface2);border-radius:13px;padding:11px 12px;margin-bottom:9px;}
.ritem .top{display:flex;align-items:center;gap:9px;}
.ritem .top .ie{font-size:16px;}
.ritem .top .nm{flex:1;font-size:13.5px;font-weight:600;}
.ritem .top .kk{font-size:13px;font-weight:750;color:var(--accent2);font-variant-numeric:tabular-nums;}
.ritem .top .del{color:var(--muted2);font-size:16px;padding:0 2px;cursor:pointer;line-height:1;}
.chips{display:flex;gap:6px;margin-top:9px;}
.chip{flex:1;text-align:center;font-size:11px;font-weight:600;padding:5px 0;border-radius:8px;
  background:var(--surface3);color:var(--muted);cursor:pointer;transition:.13s;}
.chip.on{background:rgba(255,122,69,.18);color:var(--accent2);box-shadow:0 0 0 1px rgba(255,122,69,.4) inset;}
.sum{display:flex;justify-content:space-between;align-items:center;padding:12px 2px 4px;
  font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);margin-top:6px;}
.sum b{font-size:17px;color:var(--text);font-weight:800;}
/* 我的 */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px;}
.card .row{display:flex;align-items:center;gap:11px;padding:13px 14px;border-bottom:1px solid rgba(255,255,255,.045);}
.card .row:last-child{border-bottom:none;}
.card .row .k{flex:1;font-size:13.5px;font-weight:550;}
.card .row .v{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
.card .row .arr{color:var(--muted2);font-size:13px;}
.cardt{font-size:11px;color:var(--muted2);padding:0 4px 8px;letter-spacing:.05em;margin-top:18px;font-weight:600;}
.mrow{display:flex;align-items:center;gap:11px;padding:13px 14px;border-bottom:1px solid rgba(255,255,255,.045);cursor:pointer;}
.mrow:last-child{border-bottom:none;}
.mrow .av{width:34px;height:34px;border-radius:99px;display:grid;place-items:center;font-size:15px;flex:0 0 34px;}
.mrow .info{flex:1;min-width:0;}
.mrow .info .n{font-size:13.5px;font-weight:650;}
.mrow .info .s{font-size:10.5px;color:var(--muted2);margin-top:3px;}
.mrow .chk{width:19px;height:19px;border-radius:99px;border:1.5px solid var(--surface3);display:grid;place-items:center;font-size:11px;color:#0B0D10;}
.mrow.on .chk{background:var(--accent);border-color:var(--accent);}
input,select{font-family:inherit;}
.fld{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--text);
  padding:10px 12px;font-size:12.5px;outline:none;}
.fld:focus{border-color:rgba(255,122,69,.5);}
.fld::placeholder{color:var(--muted2);}
input[type="date"].fld{color-scheme:dark;padding-right:6px;}
.pchip{font-size:11px;font-weight:600;padding:6px 10px;border-radius:8px;background:var(--surface3);
  color:var(--muted);cursor:pointer;white-space:nowrap;transition:.13s;border:1px solid transparent;}
.pchip.on{background:rgba(255,122,69,.16);color:var(--accent2);border-color:rgba(255,122,69,.4);}
.pchip:active{transform:scale(.96);}
/* 语言分段控件：语言是二元互斥选择，用分段比列表行更直观、也更省高度 */
.seg{display:flex;gap:5px;background:var(--surface2);padding:4px;border-radius:12px;}
.seg .o{flex:1;text-align:center;padding:9px 0;border-radius:9px;font-size:12.5px;font-weight:650;
  color:var(--muted);cursor:pointer;transition:.15s;letter-spacing:.02em;}
.seg .o.on{background:var(--accent);color:#0B0D10;}
.seg .o:active{transform:scale(.97);}
/* 语言不是"设置项"，是全局开关 → 收进页头右上角的小药丸，不再占一张卡片 */
.langpill{display:flex;gap:3px;background:var(--surface2);padding:3px;border-radius:99px;
  border:1px solid var(--line);margin-top:4px;}
.langpill .lp{font-size:10.5px;font-weight:750;padding:5px 9px;border-radius:99px;color:var(--muted2);
  cursor:pointer;letter-spacing:.03em;transition:.15s;}
.langpill .lp.on{background:var(--accent);color:#0B0D10;}
/* 折叠区：长内容默认收起，页面才不用滚半天 */

   1. 热量只用「区间 + 三档份量」表达，不追求精确克数。
   2. 一切写入走 record 单一入口，日历只做聚合读取。
   3. 识别器可插拔：mock 与真实 API 同签名，后续换后端不改 UI。
   ============================================================ */

/* ---------- 基础工具 ---------- */
const pad = n => String(n).padStart(2, '0');
const dk = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDK = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Y 轴刻度：先把上限抬到"整齐"的数字，再按不超过 4 段切分。
   直接按 maxV 分四等份会得到 1337 / 2674 这种读数，没人看得懂。 */
function niceScale(rawMax, goal) {
  const wanted = Math.max(rawMax, 200) * 1.1;
  // 优先让目标值落在刻度线上：目标 1800 卡在 1k 和 2k 中间时，
  // 橙色虚线会紧贴 2k 网格线，读图的人容易把它当成 2k。命中刻度就染橙色，一眼对上。
  if (goal > 0) {
    for (const step of [900, 800, 600, 500, 400, 300, 250, 200, 100]) {
      if (goal % step) continue;
      const n = Math.ceil(wanted / step);
      if (n <= 3) return { max: n * step, step, n };
    }
  }
  for (const step of [100, 200, 250, 500, 1000]) {
    const n = Math.ceil(wanted / step);
    if (n <= 4) return { max: n * step, step, n };
  }
  const n = Math.ceil(wanted / 1000);
  return { max: n * 1000, step: 1000, n };
}

/* 取词：找不到 key 时回退中文，再回退 key 本身，避免界面出现空白 */
function t(key, vars) {
  const pack = I18N[LANG] || I18N.zh;
  let s = pack[key];
  if (s === undefined) s = I18N.zh[key];
  if (s === undefined) s = key;
  if (typeof s === 'string' && vars) {
    s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
  }
  return s;
}
const weekNames = () => I18N[LANG].week;
const monthNames = () => I18N[LANG].months;

/* 日期格式化：中文「11月24日 周二」/ 英文「Nov 24, Tue」 */
function fmtDate(d) {
  if (LANG === 'en') return `${monthNames()[d.getMonth()]} ${d.getDate()}, ${weekNames()[d.getDay()]}`;
  return `${d.getMonth() + 1}月${d.getDate()}日 周${weekNames()[d.getDay()]}`;
}
/* 月份标题：中文「2026年11月」/ 英文「Nov 2026」 */
function fmtMonth(y, mo) {
  return t('cal.monthFmt', { y, m: monthNames()[mo] });
}
/* 食物名：英文模式用本地化译名，缺失时回退中文原名 */
const foodName = f => (LANG === 'en' && f && f.en) ? f.en : (f && f.n) || '';
const foodUnit = f => (LANG === 'en' && f && f.eu) ? f.eu : (f && f.u) || '';

/* 记录里存的是「规范中文名」（数据中性，不随语言漂移），
   显示时才按当前语言反查译名。这样切语言不会改坏历史记录，
   而库里没有的自定义食物（"妈妈做的红烧排骨"）原样显示。 */
function itemName(it) {
  if (LANG !== 'en') return it.name;
  if (it.nameEn) return it.nameEn;             // 模型直接给了英文名就用它，最准
  const f = FOOD_POOL.find(x => x.n === it.name || x.en === it.name);
  return (f && f.en) || it.name;
}
function itemUnit(it) {
  if (LANG !== 'en') return it.unit || '';
  const f = FOOD_POOL.find(x => x.n === it.name || x.en === it.name);
  return (f && f.eu) || it.unit || '';
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- 演示数据（确定性生成过去 75 天 + 今天）
   关键：不是随便堆菜，而是按「餐次预算」分配，让日总量落在目标 85%-115%，
   周末上浮 15% 制造超支模式。否则日历上会出现一堆 2.4k 的红格，一眼假。 ---------- */
function seedDemo(s) {
  const rnd = mulberry32(20261124);
  s.members.forEach(m => {
    s.records[m.id] = s.records[m.id] || {};
    for (let i = 75; i >= 0; i--) {
      const d = addDays(new Date(), -i);
      const key = dk(d);
      const isToday = i === 0;
      if (!isToday && rnd() < 0.09) continue;          // 约 9% 的日子完全没记
      const wd = d.getDay();
      const weekend = wd === 0 || wd === 6;
      const dayBudget = m.target * (weekend ? 1.15 : 0.9) * (0.85 + rnd() * 0.28);

      const share = { breakfast: 0.25, lunch: 0.4, dinner: 0.3, snack: 0.05 };
      const plan = isToday ? ['breakfast', 'lunch']
                 : weekend ? ['breakfast', 'lunch', 'dinner', 'snack']
                 : ['breakfast', 'lunch', 'dinner'];

      const meals = {};
      plan.forEach(mid => {
        if (!isToday && mid !== 'snack' && rnd() < 0.05) return;   // 偶尔漏一餐
        const pool = FOOD_POOL.filter(f => f.m.includes(mid));
        const cap = dayBudget * share[mid];
        const used = new Set();
        const arr = [];
        let acc = 0;
        for (let g = 0; g < 20 && arr.length < 4; g++) {
          const f = pool[Math.floor(rnd() * pool.length)];
          if (used.has(f.n)) continue;
          const p = rnd() < 0.7 ? PORTIONS[1] : PORTIONS[rnd() < 0.5 ? 0 : 2];
          if (arr.length && acc + f.k * p.v > cap * 1.2) continue;
          used.add(f.n);
          arr.push({ id: uid(), name: f.n, emoji: f.e, unit: f.u, baseKcal: f.k, portion: p.v, portionLabel: p.label });
          acc += f.k * p.v;
          if (acc >= cap * 0.8) break;
        }
        if (arr.length) meals[mid] = arr;
      });
      s.records[m.id][key] = meals;
    }
  });
  seedWeights(s);
}

/* 体重演示：每 2~4 天一条，整体缓慢下降 + 小幅波动。
   故意不生成「今天」——原型要让人真实走一遍手动录入，而不是一打开就发现今天已被填好。 */
function seedWeights(s) {
  const rnd = mulberry32(20261125);
  s.weights = s.weights || {};
  s.members.forEach((m, mi) => {
    if (Object.keys(s.weights[m.id] || {}).length) return;
    const start = mi === 0 ? 73.2 : 58.6;   // 不同成员不同起点，避免两条曲线一样
    const drop = mi === 0 ? 4.4 : 2.6;
    const out = {};
    let i = 74;
    while (i >= 1) {
      const key = dk(addDays(new Date(), -i));
      const prog = (74 - i) / 74;
      out[key] = Math.round((start - drop * prog + (rnd() - 0.5) * 0.6) * 10) / 10;
      i -= 2 + Math.floor(rnd() * 3);
    }
    s.weights[m.id] = out;
  });
}

/* ---------- 计算口径 ---------- */
const itemKcal = it => Math.round(it.baseKcal * it.portion);
const mealKcal = arr => (arr || []).reduce((a, it) => a + itemKcal(it), 0);
function dayMeals(memberId, key) { return (state.records[memberId] || {})[key] || {}; }
function dayTotal(memberId, key) { return MEALS.reduce((a, m) => a + mealKcal(dayMeals(memberId, key)[m.id]), 0); }
function member() { return state.members.find(m => m.id === state.currentMemberId) || state.members[0]; }
// 区间：模型/档位本身就是估算，统一给 ±15% 表达，避免"1873"这种假精确
function dayRange(total) { return [Math.round(total * 0.85 / 10) * 10, Math.round(total * 1.15 / 10) * 10]; }
/* ---------- 体重 ---------- */
const weightMap = id => state.weights[id] || {};

/* 取窗口内的体重记录（按日期升序）。窗口内不足 2 条时退化为「最近 8 条」，
   否则刚用几天的人看到的是一条点不成的线。 */
function weightSeries(memberId, days) {
  const all = weightMap(memberId);
  const keys = Object.keys(all).filter(k => +all[k] > 0).sort();
  const t1 = parseDK(dk(new Date())).getTime();
  const t0 = t1 - ((days || 30) - 1) * 864e5;
  let arr = keys.filter(k => parseDK(k).getTime() >= t0);
  if (arr.length < 2) arr = keys.slice(-8);
  return arr.map(k => ({ key: k, kg: +all[k] }));
}
/* 相对首条的变化量。用「首条→末条」而不是「前一天」，因为体重是稀疏数据 */
function weightDelta(arr) {
  if (arr.length < 2) return null;
  return Math.round((arr[arr.length - 1].kg - arr[0].kg) * 10) / 10;
}
const fmtKg = v => (v > 0 ? '+' : '') + v.toFixed(1);
const dltCls = d => (d === null ? 'flat' : d < 0 ? 'down' : d > 0 ? 'up' : 'flat');

/* 折线图。viewBox 固定比例（不做 preserveAspectRatio="none"），
   否则 <text> 和圆点会被横向拉伸变形。 */
function weightChart(memberId, days, H) {
  const arr = weightSeries(memberId, days);
  const h = H || 96;
  if (!arr.length) {
    return `<div class="wempty">${t('wt.empty')}</div>`;
  }

  const vals = arr.map(p => p.kg);
  const mn = Math.min(...vals), mx = Math.max(...vals);
  /* 三档刻度，中心吸到 0.5 的倍数，跨度取 2*step —— 这样三个数字都是整的
     （69.0 / 70.0 / 71.0），不会出现 70.8 / 69.8 / 68.8 这种像随机数的刻度。
     同时保证可见跨度至少 2kg：真实称重日间波动 0.3-0.6kg 很正常，
     按实际跨度铺满整张图会把正常波动画成"暴涨暴跌"，那是假信号。 */
  const gh = (mn + mx) / 2;
  const mid = Math.round(gh * 2) / 2;
  const need = Math.max((mx - mn) * 1.35, 2);
  const step = need <= 1 ? 0.5 : need <= 2 ? 1 : need <= 4 ? 2 : need <= 8 ? 4 : 8;
  let lo = mid - step, hi = mid + step;
  while (lo > mn || hi < mx) { lo -= step; hi += step; }   // 取整后数据仍要落在框内

  const ts = arr.map(p => parseDK(p.key).getTime());
  let t0 = ts[0], t1 = ts[ts.length - 1];
  if (t1 === t0) { t0 -= 864e5; t1 += 864e5; }      // 单点也要有横向跨度

  const W = 300, PX = 30, PR = 6, PY = 9;
  const px = ms => PX + ((ms - t0) / (t1 - t0)) * (W - PX - PR);
  const py = kg => PY + (1 - (kg - lo) / (hi - lo)) * (h - PY * 2);

  const pts = arr.map(p => {
    const x = px(parseDK(p.key).getTime());
    return { x: +x.toFixed(1), y: +py(p.kg).toFixed(1), kg: p.kg, key: p.key };
  });

  // Y 轴三档网格（取到 0.1，不硬凑整数——体重本来就会是 68.4 这种数）
  const grid = [lo, mid, hi].map(v => ({ v: Math.round(v * 10) / 10, y: +py(v).toFixed(1) }));
  const gridHtml = grid.map(g =>
    `<line x1="${PX}" y1="${g.y}" x2="${W - PR}" y2="${g.y}" stroke="rgba(255,255,255,.1)" stroke-width="1"/>
     <text x="${PX - 5}" y="${g.y + 3}" text-anchor="end" fill="#5E6678" font-size="8.5">${g.v.toFixed(1)}</text>`
  ).join('');

  const line = pts.map((p, i) => (i ? 'L' : 'M') + p.x + ' ' + p.y).join(' ');
  // 线下渐变填充贴到绘图区底部，不是贴到 SVG 底部（否则会盖住 Y 轴标签区）
  const baseY = (h - PY).toFixed(1);
  const area = pts.length > 1
    ? `M${pts[0].x} ${baseY} L${pts.map(p => p.x + ' ' + p.y).join(' L')} L${pts[pts.length - 1].x} ${baseY} Z`
    : '';
  const dots = pts.map((p, i) => {
    const last = i === pts.length - 1;
    return `<circle cx="${p.x}" cy="${p.y}" r="${last ? 3.4 : 2.2}"
      fill="${last ? '#FF7A45' : '#16191F'}" stroke="${last ? '#16191F' : '#FFB088'}" stroke-width="${last ? 2 : 1.4}"/>`;
  }).join('');

  // aspect-ratio 必须显式给：只写 height:auto 时，innerHTML 重建的瞬间浏览器
  // 还没算出 SVG 高度，scrollHeight 会少掉一整块，恢复滚动位置就会被压到更小的值。
  return `<svg viewBox="0 0 ${W} ${h}" width="100%"
      style="display:block;height:auto;aspect-ratio:${W}/${h}" role="img"
      aria-label="${t('wt.title')}">
    <defs>
      <linearGradient id="wg${H || ''}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FF7A45" stop-opacity=".22"/>
        <stop offset="100%" stop-color="#FF7A45" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${gridHtml}
    ${area ? `<path d="${area}" fill="url(#wg${H || ''})"/>` : ''}
    ${pts.length > 1 ? `<path d="${line}" fill="none" stroke="#FF7A45" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>` : ''}
    ${dots}
  </svg>`;
}

const fmtMD = key => { const d = parseDK(key); return (d.getMonth() + 1) + '/' + d.getDate(); };

/* 餐次名与份量标签的本地化出口：视图里不再直接读 meal.name / portion.label */
const mealOf = id => MEALS.find(x => x.id === id) || MEALS[3];
const mealName = id => (LANG === 'en' ? mealOf(id).en : mealOf(id).name);
const portionLabel = p => t((PORTIONS.find(x => Math.abs(x.v - p) < 0.01) || PORTIONS[1]).lk);
/* 成员名是用户数据：只有内置的演示成员带英文名，自己添加的原样显示 */
const memberName = mm => (LANG === 'en' && mm.en) ? mm.en : mm.name;

/* 当日提示必须结合「时间进度」，否则早上十点就会说"摄入偏少、容易报复性进食"。
   这是同类产品最常见的低级错误：只比较摄入量和目标，不看现在几点。 */
function dayHint(total, target, key) {
  if (!total) return t('hint.empty');
  if (total > target * 1.05) return t('hint.over', { d: total - target });
  const isToday = key === dk(new Date());
  if (!isToday) return total < target * 0.8 ? t('hint.pastUnder') : t('hint.pastOk');
  const now = new Date();
  const h = now.getHours() + now.getMinutes() / 60;
  const expected = clamp((h - 6) / 15, 0.08, 1);   // 6:00 起算，21:00 到满
  const progress = total / target;
  const left = target - total;
  if (progress < expected * 0.55) return t('hint.low', { n: left });
  if (progress < expected * 1.0) return t('hint.mid', { n: left });
  return t('hint.high', { n: left });
}

function dayStatus(total, target) {
  if (!total) return 'none';
  const r = total / target;
  if (r < 0.8) return 'under';
  if (r <= 1.05) return 'near';
  return 'over';
}
const statusText = st => t('st.' + st);

  if (keepScroll) requestAnimationFrame(() => { app.scrollTop = sc; });

}

/* ---------- 视图：日历 ---------- */
/* 体重卡片：放在日历页最底部，和热量趋势同屏对照（吃得少到底有没掉秤） */
function weightCard(m) {
  const arr = weightSeries(m.id, 30);
  const cur = arr.length ? arr[arr.length - 1].kg : null;
  const dl = weightDelta(arr);
  const spanDays = arr.length > 1
    ? Math.round((parseDK(arr[arr.length - 1].key) - parseDK(arr[0].key)) / 864e5)
    : 0;
  const cls = dltCls(dl);

  return `<div class="sec"><h3>${t('wt.title')}</h3>
      <span class="act" style="color:var(--accent2)" data-act="openWeight">＋ ${t('wt.log')}</span>
    </div>
    <div class="chart wcard" data-act="openWeight" style="cursor:pointer">
      ${cur === null ? '' : `<div class="wtop">
        <div class="wnum">${cur.toFixed(1)}<i>${t('wt.unit')}</i></div>
        ${dl === null
          ? `<div class="wdlt flat">${t('wt.onlyOne')}</div>`
          : `<div class="wdlt ${cls}">${fmtKg(dl)} kg · ${t('wt.days', { d: spanDays })}</div>`}
      </div>`}
      ${weightChart(m.id, 30, 96)}
      ${arr.length > 1 ? `<div class="wx"><span>${fmtMD(arr[0].key)}</span><span>${fmtMD(arr[arr.length - 1].key)}</span></div>` : ''}
    </div>`;
}

function viewCalendar(m) {
  const y = view.calYear, mo = view.calMonth;
  const first = new Date(y, mo, 1);
  const startPad = first.getDay();
  const days = new Date(y, mo + 1, 0).getDate();
  const todayKey = dk(new Date());

  let cells = '';
  for (let i = 0; i < startPad; i++) cells += `<div class="cell blank"></div>`;
  let recDays = 0, okDays = 0, sum = 0;
  for (let d = 1; d <= days; d++) {
    const key = `${y}-${pad(mo + 1)}-${pad(d)}`;
    const t = dayTotal(m.id, key);
    const st = dayStatus(t, m.target);
    if (t) { recDays++; sum += t; }
    if (st === 'near') okDays++;
    const cls = ['cell', t ? 'has' : '', st !== 'none' ? st : '', key === todayKey ? 'today' : ''].filter(Boolean).join(' ');
    cells += `<div class="${cls}" data-act="openDay" data-key="${key}">
      <div class="dn">${d}</div>
      <div class="k">${t ? (t > 999 ? (t / 1000).toFixed(1) + 'k' : t) : ''}</div>
    </div>`;
  }

  // 近 7 日
  const bars = [];
  let maxV = 0;
  for (let i = 6; i >= 0; i--) {
    const d = addDays(new Date(), -i);
    const key = dk(d);
    const t = dayTotal(m.id, key);
    if (t > maxV) maxV = t;
    bars.push({ key, d, t });
  }

  // 刻度上限至少覆盖「目标值」，否则目标线会跑到图外
  const scale = niceScale(Math.max(maxV, m.target), m.target);
  const pos = v => clamp((v / scale.max) * 100, 0, 100);
  const ticks = [];
  for (let v = 0; v <= scale.max; v += scale.step) ticks.push(v);

  const gridHtml = ticks.map(v =>
    `<div class="gl ${v === 0 ? 'zero' : ''}" style="bottom:${pos(v)}%"></div>`).join('');

  // 目标值恰好落在刻度上时染成橙色，等于免费多标一个目标刻度；
  // 没落在刻度上就不硬塞标签（会和邻近刻度挤在一起），靠橙色虚线 + 标题文字说明。
  const yHtml = ticks.map(v => {
    const isGoal = Math.abs(v - m.target) < scale.step * 0.05;
    return `<div class="yt ${isGoal ? 'goal' : ''}" style="bottom:${pos(v)}%">${shortK(v)}</div>`;
  }).join('');

  const barsHtml = bars.map(b => {
    const st = dayStatus(b.t, m.target);
    const tip = `${b.key}${b.t ? ' · ' + t('c.approx') + ' ' + b.t + ' kcal' : ' · ' + t('cal.noData')}`;
    const inner = b.t
      ? `<div class="b ${st}" style="height:${Math.max(3, pos(b.t))}%"></div>`
      : `<i class="nodata"></i>`;
    return `<div class="col" title="${tip}">${inner}</div>`;
  }).join('');

  const xHtml = bars.map(b => `<span>${weekNames()[b.d.getDay()]}</span>`).join('');
  const avg = recDays ? Math.round(sum / recDays) : 0;

  return `<div class="page">
    <div class="calhead">
      <div>
        <div class="m">${fmtMonth(y, mo)}<span>· ${esc(memberName(m))}</span></div>
      </div>
      <div style="display:flex;gap:7px">
        <div class="navb" data-act="calPrev">‹</div>
        <div class="navb" data-act="calNext">›</div>
      </div>
    </div>
    <div class="wk">${weekNames().map(w => `<div>${w}</div>`).join('')}</div>
    <div class="grid">${cells}</div>
    <div class="legend">
      <span><i style="background:var(--ok)"></i>${t('cal.legendUnder')}</span>
      <span><i style="background:var(--warn)"></i>${t('cal.legendNear')}</span>
      <span><i style="background:var(--over)"></i>${t('cal.legendOver')}</span>
    </div>

    <div class="mstat">
      <div class="c"><div class="v">${recDays}</div><div class="l">${t('cal.recDays')}</div></div>
      <div class="c"><div class="v" style="color:var(--warn)">${okDays}</div><div class="l">${t('cal.okDays')}</div></div>
      <div class="c"><div class="v">${avg || '—'}</div><div class="l">${t('cal.avgDay')}</div></div>
    </div>

    <div class="sec"><h3>${t('cal.last7')}</h3>
      <span class="act" style="color:var(--muted2);display:inline-flex;align-items:center;gap:6px">
        <i style="display:inline-block;width:15px;border-top:1px dashed var(--warn);opacity:.85"></i>${t('c.target')} ${m.target}
      </span>
    </div>
    <div class="chart">
      <div class="plotwrap">
        <div class="yaxis">${yHtml}</div>
        <div class="plot">
          ${gridHtml}
          <div class="goalline" style="bottom:${pos(m.target)}%"></div>
          <div class="cols">${barsHtml}</div>
        </div>
      </div>
      <div class="xlabels" style="margin-left:34px">${xHtml}</div>
    </div>

    ${weightCard(m)}
  </div>`;
}

/* ---------- 交互动作 ---------- */
// 绑在 #phone 上（app 与 tabbar 的共同祖先），底部导航才能被点到
root.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const key = el.dataset.key;
  const meal = el.dataset.meal;
  const id = el.dataset.id;

  switch (act) {
    case 'tab': view.tab = id; render(); break;
    // 语言切换：LANG 是全局渲染依据，改完必须重渲染整页 + 同步 <html lang>
    case 'setLang': {
      if (!LANGS.some(l => l.id === id)) break;
      LANG = id;
      state.settings.lang = id;
      document.documentElement.lang = id === 'en' ? 'en' : 'zh-CN';
      save();
      render(true);
      toast(id === 'en' ? t('toast.langEn') : t('toast.langZh'));
      break;
    }
    // 「我的」页三处折叠：只改 view 里的开关再重渲染，并保住滚动位置
    case 'toggleApi': view.me.api = !view.me.api; render(true); break;
    case 'toggleWhy': view.me.why = !view.me.why; render(true); break;
    case 'toggleData': view.me.data = !view.me.data; render(true); break;
    case 'openCam': view.sheet = { type: 'cam', meal }; renderSheet(); break;
    case 'openQuick': view.sheet = { type: 'quick', meal: guessMeal() }; renderSheet(); break;
    case 'openWeight': view.sheet = { type: 'weight' }; renderSheet(); break;
    case 'calPrev':
      view.calMonth--; if (view.calMonth < 0) { view.calMonth = 11; view.calYear--; } render(); break;
    case 'calNext':
      view.calMonth++; if (view.calMonth > 11) { view.calMonth = 0; view.calYear++; } render(); break;
    // 点日历格子 → 弹出当天详情，而不是粗暴地跳走整页
    // （之前跳 tab 时，若点的是"今天"，页面看起来毫无变化，用户会以为点不动）
    case 'openDay': view.sheet = { type: 'dayDetail', key }; renderSheet(); break;
    case 'switchMember': view.sheet = { type: 'members' }; renderSheet(); break;
    case 'pickMember':
      state.currentMemberId = id; save(); view.sheet = null; closeSheet(); render(); break;
    case 'addMember': addMember(); break;
    case 'saveVision': saveVision(); break;
    case 'testVision': testVision(); break;
    case 'setProvider': setProvider(id); break;
    case 'setEngine':
      state.settings.engine = id; save();
      toast(id === 'local' ? t('toast.engineLocal') : t('toast.engineCloud'));
      render(); break;
    case 'exportData': exportData(); break;
    case 'resetData': resetData(); break;
    case 'delItem': {
      const arr = dayMeals(state.currentMemberId, view.dateKey)[meal];
      if (arr) {
        const i = arr.findIndex(x => x.id === id);
        if (i >= 0) arr.splice(i, 1);
        save(); render();
      }
      break;
    }
    case 'closeSheet': closeSheet(); break;
  }
});

/* 按当前时间猜餐次，省掉一次"这是哪一餐"的选择 */
function guessMeal() {
  const h = new Date().getHours();
  if (h < 10) return 'breakfast';
  if (h < 15) return 'lunch';
  if (h < 21) return 'dinner';
  return 'snack';
}

/* 加成员：原型用 prompt 简化，正式版应做成独立表单页 */
function addMember() {
  const name = (window.prompt(t('prompt.newMember')) || '').trim();
  if (!name) return;
  const colors = [
    'linear-gradient(140deg,#7DD3FC,#3B82F6)',
    'linear-gradient(140deg,#C4B5FD,#8B5CF6)',
    'linear-gradient(140deg,#FDE68A,#F59E0B)'
  ];
  const id = 'm' + uid();
  state.members.push({ id, name, emoji: '🙂', target: 1800, color: colors[state.members.length % colors.length] });
  state.records[id] = {};
  state.currentMemberId = id;
  save(); render();
  toast(t('toast.addedMember', { n: name }));
}

window.setTarget = function (v) {
  member().target = v; save(); toast(t('toast.targetUpdated'));

/* 表单草稿：折叠时输入框不在 DOM 里，下一次渲染靠它把内容填回去，
   否则"填了 Key → 收起来 → 再展开"会把刚打的字全丢掉。 */
window.visionDraft = function (k, v) {
  if (!view.vdraft) view.vdraft = { base: '', key: '', model: '' };
  view.vdraft[k] = v;
};

function readVisionForm() {
  const v = Object.assign({ base: '', key: '', model: '' }, view.vdraft || {});
  const g = (id, k) => { const el = document.getElementById(id); if (el) v[k] = el.value.trim(); };
  g('fBase', 'base'); g('fKey', 'key'); g('fModel', 'model');
  return { base: v.base || '', key: v.key || '', model: v.model || '' };
}

/* 切换预设：先保住用户已经打进去的 Key，再覆盖地址和模型名 */
function setProvider(id) {
  const p = VISION_PRESETS[id];
  if (!p) return;
  const cur = readVisionForm();
  state.settings.vision = {
    provider: id,
    base: p.base || cur.base,
    key: cur.key,
    model: p.model || cur.model
  };
  view.vdraft = { base: state.settings.vision.base, key: cur.key, model: state.settings.vision.model };
  save(); render(true);
  toast(p.base ? t('toast.providerFilled', { n: presetShort(p) }) : t('toast.customMode'));
}

function saveVision() {
  const v = readVisionForm();
  const prev = state.settings.vision || {};
  state.settings.vision = { provider: prev.provider || 'custom', base: v.base, key: v.key, model: v.model };
  view.vdraft = { base: v.base, key: v.key, model: v.model };
  save(); render(true);
  toast(v.base && v.key ? t('toast.visionSaved') : t('toast.visionCleared'));
}

/* 测试连接：发一个 max_tokens=1 的最小请求，只为验证地址/Key/模型名三者对不对。
   在浏览器里失败率很高，因为跨域 —— 这不是配置错，要跟用户讲清楚。 */
async function testVision() {
  const out = document.getElementById('testOut');
  if (!out) return;
  const v = readVisionForm();
  if (!v.base) { out.textContent = '先把接口地址填上'; out.style.color = 'var(--warn)'; return; }
  if (!v.key) { out.textContent = 'Key 还没填。云端接口必须填 Key，否则没法验证。'; out.style.color = 'var(--warn)'; return; }
  if (!v.model) { out.textContent = '模型名还没填'; out.style.color = 'var(--warn)'; return; }

  out.textContent = '正在请求…'; out.style.color = 'var(--muted)';
  const t0 = performance.now();
  try {
    const res = await fetch(v.base.replace(/\/+$/, '') + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + v.key },
      body: JSON.stringify({ model: v.model, messages: [{ role: 'user', content: 'ping' }], max_tokens: 1 })
    });
    const ms = Math.round(performance.now() - t0);
    if (res.ok) {
      out.textContent = `连通 ✓ 往返 ${ms}ms`;
      out.style.color = 'var(--ok)';
      return;
    }
    let extra = '';
    if (res.status === 401 || res.status === 403) extra = 'Key 无效或没有该模型权限';
    else if (res.status === 404) extra = '地址不对，或模型名不存在';
    else if (res.status === 400) extra = '多半是模型名不对（火山的要填 ep- 开头的接入点）';
    else if (res.status === 429) extra = '触发限流，稍后再试';
    else extra = (await res.text().catch(() => '')).slice(0, 70);
    out.textContent = `HTTP ${res.status} · ${extra}`;
    out.style.color = 'var(--over)';
  } catch (e) {
    out.textContent = '连不上：被浏览器跨域（CORS）拦了，或者本机服务没起来。网页里失败是常态，不算你配置错。';
    out.style.color = 'var(--warn)';
  }
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `calorie-backup-${dk(new Date())}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(t('toast.exported'));
}

function resetData() {
  if (!confirm(t('confirm.reset'))) return;
  state = DEFAULT_STATE(); seedDemo(state);

/* ---------- Sheet ---------- */
let sheetEl = null;
// 弹层里改过数据（如体重）时置位：关闭弹层要刷新主页面，否则主页显示的还是旧值
let dirtyMain = false;

function closeSheet() {
  view.sheet = null;
  if (sheetEl) { sheetEl.remove(); sheetEl = null; }
  // 保持滚动位置：用户是从日历页底部点开的体重卡，刷新后跳回顶部会很突兀
  if (dirtyMain) { dirtyMain = false; render(true); }
}

function renderSheet() {
  if (sheetEl) { sheetEl.remove(); sheetEl = null; }
  if (!view.sheet) return;
  const s = view.sheet;
  const mask = document.createElement('div');
  mask.className = 'mask';
  mask.addEventListener('click', ev => { if (ev.target === mask) closeSheet(); });

  // 注意：没有分支的类型必须直接 return，绝不能挂一个空的面板上去
  // —— 空面板会挡住整屏，用户只会看到"点了没反应"。
  if (s.type === 'cam' || s.type === 'quick') mask.innerHTML = sheetCam(s);
  else if (s.type === 'dayDetail') mask.innerHTML = sheetDay(s.key);
  else if (s.type === 'pickMeal') mask.innerHTML = sheetPickMeal(s);
  else if (s.type === 'members') mask.innerHTML = sheetMembers(s);
  else if (s.type === 'weight') mask.innerHTML = sheetWeight();
  else return;

  document.getElementById('phone').appendChild(mask);
  sheetEl = mask;
  bindSheetEvents(mask, s);

  // "手动添加"直接落到食物库，不让人再多点一次
  if (s.type === 'quick') openManualEntry(s.meal, mask, null);
}

      ${arr.length ? `<div class="wtop">
        <div class="wnum">${arr[arr.length - 1].kg.toFixed(1)}<i>${t('wt.unit')}</i></div>
        ${dl === null ? '' : `<div class="wdlt ${dltCls(dl)}">${fmtKg(dl)} kg</div>`}
      </div>` : ''}
      ${weightChart(m.id, 30, 150)}
      ${arr.length > 1 ? `<div class="wx"><span>${fmtMD(arr[0].key)}</span><span>${fmtMD(arr[arr.length - 1].key)}</span></div>` : ''}

      <div style="display:flex;gap:8px;margin-top:16px">
        <input class="fld" type="date" id="wDate" value="${todayKey}" max="${todayKey}"
               style="flex:0 0 140px;font-size:13px">
        <input class="fld" id="wVal" inputmode="decimal" placeholder="${t('wt.ph')}"
               value="${todayVal || ''}" style="flex:1">
      </div>

      <div style="font-size:10px;color:var(--muted2);letter-spacing:.06em;margin:18px 0 8px">${t('wt.history')}</div>
      ${rows || `<div class="wempty" style="padding:16px 8px">${t('wt.empty')}<br>
        <span style="font-size:11px">${t('wt.emptyHint')}</span></div>`}
    </div>
    <div class="sh-f">
      <button class="btn gho" data-act="closeSheet">${t('c.close')}</button>
      <button class="btn pri" id="btnWSave" data-act="saveWeight">${t('wt.save')}</button>
    </div>
  </div>`;
}

/* 体重录入。同一天只存一条：早上称和晚上称差 0.5kg，存多条只会让曲线更乱。
   保存即覆盖，UI 在覆盖前不做二次确认（体重是随手记的数据，多一步就让人不想记）。 */
function saveWeight() {
  const dEl = document.getElementById('wDate');
  const vEl = document.getElementById('wVal');
  const key = (dEl && dEl.value) || dk(new Date());
  const raw = ((vEl && vEl.value) || '').trim().replace(',', '.');
  const kg = parseFloat(raw);
  if (!raw || !isFinite(kg)) { toast(t('wt.needVal')); return; }
  if (kg < 30 || kg > 200) { toast(t('wt.badVal')); return; }
  const val = Math.round(kg * 10) / 10;
  const mid = state.currentMemberId;
  state.weights[mid] = state.weights[mid] || {};
  state.weights[mid][key] = val;
  save();
  dirtyMain = true;      // 关闭时刷新日历页，否则卡上还是旧体重
  closeSheet();
  toast(t('wt.saved', { n: val.toFixed(1) }));
}

function delWeight(key) {
  const mid = state.currentMemberId;
  if (state.weights[mid]) delete state.weights[mid][key];
  save();
  dirtyMain = true;
  renderSheet();         // 保持弹层打开，方便连着删掉误记的几条
  toast(t('wt.deleted'));
}

function bindSheetEvents(mask, s) {
  mask.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]');
    if (el) {
      const act = el.dataset.act;
      if (act === 'closeSheet') { closeSheet(); return; }
      if (act === 'pickMember') {
        state.currentMemberId = el.dataset.id; save(); closeSheet(); render(); return;
      }
      if (act === 'pickMealFor') {
        view.dateKey = el.dataset.key;
        view.sheet = { type: 'cam', meal: el.dataset.meal };
        renderSheet(); return;
      }
      if (act === 'addToDay') {
        view.sheet = { type: 'pickMeal', key: el.dataset.key };
        renderSheet(); return;
      }
      if (act === 'jumpDay') {
        view.dateKey = el.dataset.key; view.tab = 'today';
        closeSheet(); render(); return;
      }
      if (act === 'openCam') {
        view.sheet = { type: 'cam', meal: el.dataset.meal };
        renderSheet(); return;
      }
      if (act === 'saveWeight') { saveWeight(); return; }
      if (act === 'delWeight') { delWeight(el.dataset.key); return; }
      return;
    }
    if (ev.target.id === 'btnManual') { openManualEntry(s.meal, mask, null); }
  });

  if (s.type === 'cam') {
    const fc = mask.querySelector('#fileCamera');
    const fa = mask.querySelector('#fileAlbum');
    [fc, fa].forEach(inp => inp && inp.addEventListener('change', async e => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const dataUrl = await fileToDataUrl(f);
      runRecognition(s.meal, dataUrl, mask);
    }));
  }
}

function fileToDataUrl(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

/* ---------- 识别：统一入口（mock / 真实同签名） ---------- */
async function runRecognition(mealId, dataUrl, mask) {
  const body = mask.querySelector('#camBody');
  const sub = mask.querySelector('#camSub');

  // 本地食物库模式：不调任何模型，选完图直接让人点。0 延迟、100% 可控。
  if ((state.settings.engine || 'cloud') === 'local') {
    sub.textContent = t('rec.localMode');
    openManualEntry(mealId, mask, dataUrl);
    return;
  }

  body.innerHTML = `
    <img class="preview" src="${dataUrl}" alt="待识别照片">
    <div class="scan"><div class="spin"></div><span id="scanTxt">${t('rec.recognizing')}</span></div>
    <div class="pbar"><i id="pbar" style="width:8%"></i></div>`;

  const steps = t('steps');
  let i = 0;
  const pbar = () => mask.querySelector('#pbar');
  const timer = setInterval(() => {
    i = Math.min(i + 1, steps.length - 1);
    const stp = mask.querySelector('#scanTxt');
    if (stp) stp.textContent = steps[i];
    const p = pbar(); if (p) p.style.width = `${20 + i * 22}%`;
  }, 380);

  let items = null, err = null;
  try {
    items = await recognize(dataUrl);
  } catch (e) {
    err = e;
  }
  clearInterval(timer);
  if (!mask.isConnected) return;

  if (!items || !items.length) {
    sub.textContent = t('rec.failed');
    if (err) toast(String(err.message || t('rec.failMsg')).slice(0, 26));
    openManualEntry(mealId, mask, dataUrl);
    return;
  }
  sub.textContent = t('rec.confirm');
  showResult(mealId, dataUrl, items, mask);
}

function showResult(mealId, dataUrl, items, mask) {
  const body = mask.querySelector('#camBody');
  const foot = mask.querySelector('.sh-f');
  const mealTitle = mealName(mealId);
  const render = () => {
    const sum = items.reduce((a, it) => a + Math.round(it.baseKcal * it.portion), 0);
    body.innerHTML = `
      <img class="preview" src="${dataUrl}" alt="照片">
      <div style="font-size:11px;color:var(--muted2);margin:13px 0 9px;letter-spacing:.04em">
        ${t('rec.found', { n: items.length })}
      </div>
      ${items.map((it, idx) => `
        <div class="ritem">
          <div class="top">
            <div class="ie">${it.emoji || '🍽'}</div>
            <div class="nm">${esc(itemName(it))}</div>
            <div class="kk">${Math.round(it.baseKcal * it.portion)}</div>
            <div class="del" data-del="${idx}">✕</div>
          </div>
          <div class="chips">
            ${PORTIONS.map(p => `<div class="chip ${Math.abs(it.portion - p.v) < 0.01 ? 'on' : ''}"
              data-p="${p.v}" data-idx="${idx}">${t(p.lk)}</div>`).join('')}
          </div>
        </div>`).join('')}
      <div class="sum"><span>${t('rec.total')}</span><span>${t('c.approx')} <b>${sum}</b> kcal</span></div>`;

    body.querySelectorAll('[data-p]').forEach(c => c.addEventListener('click', () => {
      const idx = +c.dataset.idx;
      items[idx].portion = +c.dataset.p;
      items[idx].portionLabel = PORTIONS.find(p => p.v === +c.dataset.p).label;
      render();
    }));
    body.querySelectorAll('[data-del]').forEach(d => d.addEventListener('click', () => {
      items.splice(+d.dataset.del, 1);
      if (!items.length) { closeSheet(); return; }
      render();
    }));
    if (foot) foot.innerHTML = `
      <button class="btn gho" data-act="closeSheet">${t('c.cancel')}</button>
      <button class="btn pri" id="btnConfirm">${t('rec.addTo', { meal: mealTitle })}</button>`;
    const bc = foot && foot.querySelector('#btnConfirm');
    if (bc) bc.addEventListener('click', () => commit(mealId, items));
  };
  render();
}

function commit(mealId, items) {
  const key = view.dateKey;
  const mid = state.currentMemberId;
  state.records[mid] = state.records[mid] || {};
  state.records[mid][key] = state.records[mid][key] || {};
  const arr = state.records[mid][key][mealId] || (state.records[mid][key][mealId] = []);
  items.forEach(it => arr.push({
    id: uid(), name: it.name, emoji: it.emoji || '🍽', unit: it.unit || '',
    baseKcal: it.baseKcal, portion: it.portion, portionLabel: it.portionLabel || '正常'
  }));
  save(); closeSheet();
  const total = dayTotal(mid, key);
  toast(t('toast.logged', { n: total }));
  if (view.tab !== 'today') { view.tab = 'today'; view.dateKey = key; }
  render();
}

/* ---------- 手动输入（识别失败的兜底，比"必须识别成功"更重要） ---------- */
function openManualEntry(mealId, mask, imageUrl) {
  const body = mask.querySelector('#camBody');
  const foot = mask.querySelector('.sh-f');
  const mealTitle = mealName(mealId);

  const listHtml = kw => {
    const k = (kw || '').trim();
    const lk = k.toLowerCase();
    // 中英文名都能搜到：英文用户输入 "chicken"、中文用户输入 "鸡" 都应命中
    const list = k
      ? FOOD_POOL.filter(f => f.n.includes(k) || (f.en || '').toLowerCase().includes(lk))
      : FOOD_POOL;
    if (!list.length) return `<div style="font-size:12px;color:var(--muted2);padding:14px 2px">${t('man.notFound')}</div>`;
    return list.map(f => `
      <div class="mrow" style="background:var(--surface2);border-radius:11px;border:none;margin-bottom:6px" data-pick="${f.n}">
        <div class="av" style="background:var(--surface3);width:30px;height:30px;flex:0 0 30px;font-size:14px">${f.e}</div>
        <div class="info"><div class="n">${foodName(f)}</div><div class="s">${t('c.approx')} ${f.k} kcal · ${foodUnit(f)}</div></div>
        <div style="font-size:12px;color:var(--accent);font-weight:600">${t('c.choose')}</div>
      </div>`).join('');
  };

  body.innerHTML = `
    ${imageUrl ? `<img src="${imageUrl}" style="width:100%;height:88px;object-fit:cover;border-radius:12px;opacity:.75;margin-bottom:12px" alt="">` : ''}
    <div style="font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:11px">
      ${t('man.pickHint')}
    </div>
    <input class="fld" id="mSearch" placeholder="${t('man.search')}">
    <div id="pickList" style="display:grid;gap:0;max-height:230px;overflow:auto;margin-top:10px"></div>
    <div style="display:flex;align-items:center;gap:8px;margin:14px 2px 8px">
      <div style="flex:1;height:1px;background:var(--line)"></div>
      <span style="font-size:10px;color:var(--muted2);letter-spacing:.06em">${t('man.orSelf')}</span>
      <div style="flex:1;height:1px;background:var(--line)"></div>
    </div>
    <div style="display:grid;gap:8px">
      <input class="fld" id="mName" placeholder="${t('man.namePh')}">
      <input class="fld" id="mKcal" placeholder="${t('man.kcalPh')}" inputmode="numeric">
    </div>`;

  const listEl = body.querySelector('#pickList');
  const paint = kw => {
    listEl.innerHTML = listHtml(kw);
    listEl.querySelectorAll('[data-pick]').forEach(el => el.addEventListener('click', () => {
      const f = FOOD_POOL.find(x => x.n === el.dataset.pick);
      if (f) commit(mealId, [{ name: f.n, emoji: f.e, unit: f.u, baseKcal: f.k, portion: 1, portionLabel: '正常' }]);
    }));
  };
  paint('');
  const si = body.querySelector('#mSearch');
  if (si) si.addEventListener('input', e => paint(e.target.value));

  if (foot) foot.innerHTML = `
    <button class="btn gho" data-act="closeSheet">${t('c.cancel')}</button>
    <button class="btn pri" id="btnManualSave">${t('rec.addTo', { meal: mealTitle })}</button>`;

  const bs = foot && foot.querySelector('#btnManualSave');
  if (bs) bs.addEventListener('click', () => {
    const name = (body.querySelector('#mName').value || '').trim();
    const k = parseInt(body.querySelector('#mKcal').value, 10);
    if (!name || !k) { toast(t('man.needBoth')); return; }
    commit(mealId, [{ name, emoji: '🍽', unit: '估', baseKcal: clamp(k, 10, 3000), portion: 1, portionLabel: '正常' }]);
  });
}

/* ---------- 识别器实现 ---------- */
const VISION_PROMPT = `你是中餐营养估算助手。识别图中所有食物，只输出 JSON，不要任何解释文字。
格式：{"items":[{"name":"食物名","nameEn":"English name","portion":"少/正常/多","kcal":整数,"unit":"一碗/一盘/一个"}]}
规则：
1. 按中式常见家常做法估算，含烹饪油；
2. kcal 是"正常份量"下的估算值，不是精确值，不必过度纠结；
3. 最多 5 项，合并同类；
4. 看不清或不确定时，按偏高的保守值给，并降低 confidence。`;

async function recognize(dataUrl) {
  const cfg = state.settings.vision || {};
  if (cfg.base && cfg.key) return recognizeReal(dataUrl, cfg);
  return recognizeMock();
}

function recognizeMock() {
  return new Promise(resolve => {
    setTimeout(() => {
      const mealId = view.sheet && view.sheet.meal || 'lunch';
      const pool = FOOD_POOL.filter(f => f.m.includes(mealId));
      const src = pool.length ? pool : FOOD_POOL;
      const n = 2 + Math.floor(Math.random() * 2);
      const used = new Set();
      const items = [];
      for (let i = 0; i < n; i++) {
        const f = src[Math.floor(Math.random() * src.length)];
        if (used.has(f.n)) continue;
        used.add(f.n);
        const p = PORTIONS[Math.floor(Math.random() * 3)];
        items.push({ name: f.n, emoji: f.e, unit: f.u, baseKcal: f.k, portion: p.v, portionLabel: p.label });
      }
      resolve(items);
    }, 1400);
  });
}

async function recognizeReal(dataUrl, cfg) {
  const url = cfg.base.replace(/\/+$/, '') + '/chat/completions';
  const body = {
    model: cfg.model || 'qwen-vl-plus',
    temperature: 0.2,
    messages: [{
      role: 'user',
      content: [
        { type: 'text', text: VISION_PROMPT },
        { type: 'image_url', image_url: { url: dataUrl } }
      ]
    }]
  };
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 25000);
  let res;
  try {
    res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
      body: JSON.stringify(body),
      signal: ctrl.signal
    });
  } catch (e) {
    throw new Error('请求失败（可能是跨域被拦，需要一层自己的代理）');
  } finally { clearTimeout(t); }
  if (!res.ok) throw new Error(`接口返回 ${res.status}`);
  const json = await res.json();
  const text = json.choices?.[0]?.message?.content || '';
  return parseVisionJson(text);
}

function parseVisionJson(text) {
  if (typeof text === 'string' && Array.isArray(text)) text = text.join('');
  let s = String(text).trim();
  const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) s = fence[1].trim();
  const start = s.indexOf('{'), end = s.lastIndexOf('}');
  if (start >= 0 && end > start) s = s.slice(start, end + 1);
  let obj;
  try { obj = JSON.parse(s); } catch (e) { throw new Error('模型没返回合法 JSON'); }
  const list = obj.items || obj.foods || [];
  return list.map(it => {
    const name = it.name || '未命名';
    const k = Math.round(Number(it.kcal || it.calorie || 0)) || 200;
    const pmap = { '少': 0.7, '正常': 1, '适中': 1, '多': 1.35, '较多': 1.35, '少量': 0.7 };
    const pv = pmap[it.portion] || 1;
    const emoji = (FOOD_POOL.find(f => name.includes(f.n) || f.n.includes(name)) || {}).e || '🍽';
    return {
      name, nameEn: it.nameEn || it.name_en || '', emoji, unit: it.unit || '',
      baseKcal: Math.round(k / pv), portion: pv,
      portionLabel: PORTIONS.find(p => p.v === pv).label
    };
  }).filter(x => x.baseKcal > 0);
}

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1900);
}

/* ---------- 启动 ---------- */
render();
</script>
