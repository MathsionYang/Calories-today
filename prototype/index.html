<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>热量日历 · 原型</title>
<style>
:root{
  --bg:#08090A; --surface:#0E0F11; --surface2:#15171A; --surface3:#1D2024;
  --line:rgba(255,255,255,.065); --line2:rgba(255,255,255,.11);
  --text:#EDEEF0; --muted:#8B8D93; --muted2:#5C5F65;
  --accent:#FF7A45; --accent2:#FFB088; --ok:#34D399; --over:#F87171; --warn:#FBBF24;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.phone{
  position:relative;width:390px;height:min(812px,calc(100vh - 48px));
  background:var(--bg);border-radius:38px;overflow:hidden;
  border:1px solid var(--line2);
  box-shadow:0 24px 70px -24px rgba(0,0,0,.9);
  display:flex;flex-direction:column;
}
@media(max-width:460px){
  .stage{padding:0;}
  .phone{width:100%;height:100vh;border-radius:0;border:none;box-shadow:none;}
}
/* 状态栏 */
.sbar{height:44px;flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;font-size:13px;font-weight:600;letter-spacing:.02em;color:#fff;position:relative;z-index:5;}
.sbar .r{display:flex;align-items:center;gap:5px;opacity:.9;}
/* 应用主体 */
.app{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;}
.app::-webkit-scrollbar{display:none;}
/* 页面主滚动条隐掉，但弹层里的小列表要留可见的细滚动条：
   完全去掉会让"下面还有内容"变成猜测，系统默认的粗白条又很跳。 */
::-webkit-scrollbar{width:7px;height:7px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px;
  border:2px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.26);background-clip:content-box;}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent;}
.page{padding:0 20px 92px;animation:fade .18s ease both;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
/* 顶部：日期当标题（备忘录的做法），没有多余的"今日"字样 */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 26px;}
.head .d1{font-size:11.5px;color:var(--muted2);letter-spacing:.04em;}
.head .d2{font-size:20px;font-weight:650;letter-spacing:-.02em;}
.mchip{display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--line2);
  border-radius:99px;padding:5px 11px 5px 6px;font-size:12px;font-weight:550;cursor:pointer;
  transition:.15s;white-space:nowrap;color:var(--text);}
.mchip:active{background:var(--surface2);}
.mav{width:20px;height:20px;border-radius:99px;display:grid;place-items:center;font-size:11px;
  background:linear-gradient(140deg,#FF9A62,#FF5F6D);}
/* 今日总量：一个数字 + 一根细线，取代整张环形卡 */
.summary .big{font-size:46px;font-weight:700;letter-spacing:-.045em;line-height:1;
  font-variant-numeric:tabular-nums;}
.summary .lab{font-size:12px;color:var(--muted);margin-top:9px;letter-spacing:.01em;}
.summary .meter{height:2px;background:rgba(255,255,255,.09);border-radius:99px;margin:22px 0 9px;overflow:hidden;}
.summary .meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .45s;}
.summary .meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted2);}
.summary .meta b{color:var(--muted);font-weight:550;font-variant-numeric:tabular-nums;}
/* 分节标题（只有数据页用） */
.sec{display:flex;align-items:center;justify-content:space-between;margin:30px 0 8px;}
.sec h3{font-size:12px;margin:0;letter-spacing:.02em;color:var(--muted);font-weight:550;}
.sec .act{font-size:12px;color:var(--muted);font-weight:550;cursor:pointer;display:flex;align-items:center;gap:5px;}
/* 餐次：无卡片、无图标，只有标签 + 行 + 分隔线 */
.meal{margin-top:26px;}
.meal-h{display:flex;align-items:center;gap:10px;padding-bottom:9px;}
.meal-h .nm{flex:1;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;}
.meal-h .kk{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
.meal-h .kk b{color:var(--text);font-weight:600;}
.meal-h .add{width:22px;height:22px;border-radius:99px;border:1px solid var(--line2);
  display:grid;place-items:center;color:var(--muted);cursor:pointer;font-size:12px;line-height:1;flex:0 0 22px;}
.meal-h .add:active{background:var(--surface2);}
.item{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);}
.item .ie{font-size:13px;width:16px;text-align:center;opacity:.75;flex:0 0 16px;}
.item .in{flex:1;min-width:0;display:flex;align-items:baseline;gap:9px;}
.item .in .n{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.item .in .p{font-size:11px;color:var(--muted2);flex:0 0 auto;}
.item .ik{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
/* 删除按钮常驻但不抢眼：极淡，按下才变红 */
.item .del{font-size:12px;color:rgba(255,255,255,.16);cursor:pointer;padding:0 1px;line-height:1;}
.item .del:active{color:var(--over);}
/* 空餐：一个虚线槽位，点它就是拍照记录。不需要"还没记录"这种解释 */
.addline{display:flex;align-items:center;justify-content:center;height:36px;border:1px dashed rgba(255,255,255,.08);
  border-radius:10px;color:var(--muted2);font-size:13px;cursor:pointer;margin-top:2px;}
.addline:active{border-color:var(--accent);color:var(--accent);}
/* 底部 Tab */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:64px;padding-bottom:10px;
  background:rgba(8,9,10,.94);
  backdrop-filter:blur(20px);border-top:1px solid var(--line);display:flex;align-items:center;z-index:8;}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:7px;cursor:pointer;
  color:var(--muted2);font-size:10px;font-weight:550;transition:.15s;}
.tb.on{color:var(--text);}
.tb svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
/* 日历 */
.calhead{display:flex;align-items:center;justify-content:space-between;padding:8px 0 22px;}
.calhead .m{font-size:17px;font-weight:650;letter-spacing:-.02em;}
.calhead .m span{font-size:11.5px;color:var(--muted2);font-weight:500;margin-left:7px;}
.navb{width:28px;height:28px;display:grid;place-items:center;cursor:pointer;color:rgba(255,255,255,.62);font-size:16px;}
.navb:active{color:var(--text);}
/* 已经在当月，「下个月」不存在：淡掉而不是隐藏，位置不跳 */
.navb.off{opacity:.26;pointer-events:none;}
.wk{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
.wk div{text-align:center;font-size:10px;color:var(--muted2);font-weight:500;}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
.cell{aspect-ratio:1/1.1;border-radius:9px;background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  cursor:pointer;position:relative;transition:background .13s;}
.cell.blank{pointer-events:none;}
.cell .dn{font-size:11.5px;font-weight:500;color:var(--muted2);font-variant-numeric:tabular-nums;}
.cell .k{font-size:9.5px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;height:11px;}
.cell.has .dn{color:var(--text);}
/* 颜色只出现在底色上，kcal 数字保持中性 —— 两者同时染色会显得吵闹。
   底色只有两档：有记录=中性，超标=红。日历和柱状图用同一套语言：只有异常才上色。 */
.cell .k{color:var(--muted);}
.cell.under,.cell.near{background:rgba(255,255,255,.05);}
.cell.over{background:rgba(248,113,113,.13);}
/* 按下反馈不要改变元素几何尺寸：格子密集时缩小会让"按下点"落到格子外，
   浏览器会把 click 派发给共同祖先（.grid），表现为点边缘没反应 */
.cell.today{box-shadow:inset 0 0 0 1px rgba(255,122,69,.65);background:transparent;}
.cell.today .dn{color:var(--accent);}
/* 今天之后没有发生的事：点不开，也不该看起来能点开 */
.cell.future{pointer-events:none;}
.cell.future .dn{color:rgba(255,255,255,.22);}
.cell:active{background:var(--surface2);}
/* 月统计：一行数字，不是三张卡 */
.mstats{display:flex;gap:18px;font-size:11.5px;color:var(--muted2);padding:16px 2px 0;}
.mstats b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums;}
/* 柱状图（带 Y 轴刻度 + 目标参考线）：只有"超标"用红，其余走中性灰阶 */
/* 顶部留 7px：刻度的竖直中心要落在网格线上，最高那条会向上探出半个字高，
   没有这段留白它会顶到上面的「近 7 天」标题。 */
.chart{padding:0;margin-top:16px;}
.chart .plotwrap{display:flex;padding-top:7px;}
.chart .yaxis{position:relative;flex:0 0 30px;width:30px;height:104px;}
.chart .yaxis .yt{position:absolute;right:6px;font-size:9px;line-height:1;color:var(--muted2);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;transform:translateY(50%);}
.chart .yaxis .yt.goal{color:var(--warn);font-weight:600;}
.chart .plot{position:relative;flex:1;height:104px;}
.chart .plot .gl{position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.07);}
.chart .plot .gl.zero{background:rgba(255,255,255,.13);}
.chart .plot .goalline{position:absolute;left:0;right:0;border-top:1px dashed rgba(251,191,36,.5);z-index:2;}
.chart .cols{position:relative;display:flex;align-items:flex-end;gap:6px;height:100%;z-index:1;}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;}
.chart .col .b{width:100%;max-width:22px;border-radius:3px 3px 0 0;background:var(--surface3);
  min-height:3px;transition:height .5s cubic-bezier(.2,.8,.3,1);}
/* 没记录的日子用贴底短横线表示。画成小方块会被读成"热量很低的柱子"。 */
.chart .col .nodata{display:block;width:55%;max-width:14px;height:2px;border-radius:2px;
  background:rgba(255,255,255,.12);}
.chart .col .b.under{background:rgba(255,255,255,.12);}
.chart .col .b.near{background:rgba(255,255,255,.22);}
.chart .col .b.over{background:rgba(248,113,113,.72);}
.chart .xlabels{display:flex;gap:6px;margin-top:7px;}
.chart .xlabels span{flex:1;text-align:center;font-size:9.5px;color:var(--muted2);}
/* 体重 */
.wcard{padding:0;}
.wtop{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
.wtop .wnum{font-size:22px;font-weight:650;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.wtop .wnum i{font-size:11px;font-weight:500;color:var(--muted2);margin-left:3px;font-style:normal;}
.wtop .wdlt{font-size:11.5px;font-weight:550;font-variant-numeric:tabular-nums;}
.wtop .wdlt.down{color:var(--ok);}
.wtop .wdlt.up{color:var(--over);}
.wtop .wdlt.flat{color:var(--muted2);}
.wempty{font-size:12px;color:var(--muted2);text-align:center;padding:22px 8px;}
/* 体重历史列表（弹层内） */
.wrow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line);}
.wrow .d{font-size:11px;color:var(--muted2);width:44px;font-variant-numeric:tabular-nums;}
.wrow .k{flex:1;font-size:13.5px;font-weight:550;font-variant-numeric:tabular-nums;}
.wrow .x{font-size:14px;color:var(--muted2);padding:0 3px;cursor:pointer;}
.wrow .x:active{color:var(--over);}
/* 曲线两端日期：说明这条线覆盖多长，不是标签 */
.wx{display:flex;justify-content:space-between;font-size:9.5px;color:var(--muted2);
  margin-top:8px;padding-left:30px;padding-right:4px;font-variant-numeric:tabular-nums;}
/* 面板 sheet */
.mask{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:20;
  display:flex;align-items:flex-end;animation:fadein .16s ease both;}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sheet{width:100%;background:var(--bg);border-radius:20px 20px 0 0;border-top:1px solid var(--line2);
  max-height:88%;display:flex;flex-direction:column;animation:up .24s cubic-bezier(.2,.85,.3,1) both;}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sh-h{padding:10px 20px 14px;border-bottom:1px solid var(--line);flex:0 0 auto;position:relative;}
.sh-h .grab{width:32px;height:3px;border-radius:9px;background:var(--surface3);margin:0 auto 14px;}
.sh-h .t{font-size:16px;font-weight:650;letter-spacing:-.01em;}
.sh-h .s{font-size:11.5px;color:var(--muted2);margin-top:5px;font-variant-numeric:tabular-nums;}
.sh-h .x{position:absolute;right:16px;top:16px;width:26px;height:26px;border-radius:99px;
  display:grid;place-items:center;font-size:14px;color:var(--muted);cursor:pointer;}
.sh-h .x:active{background:var(--surface2);}
/* 状态行（正在识别 / 未识别）没内容时不要留空隙 */
.sh-h .s:empty{display:none;}
/* 弹层里的餐次列表贴着标题，不需要今日页那样的大间隔 */
.sh-b .meal:first-child{margin-top:0;}
.sh-b{overflow-y:auto;padding:16px 20px;flex:1;scrollbar-width:none;}
.sh-b::-webkit-scrollbar{display:none;}
/* 手动录入的候选列表：高度取 4 行整（53px×4），滚动时不会切出半行 */
.picklist{display:grid;gap:0;max-height:212px;overflow:auto;margin-top:10px;}
.sh-f{padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  display:flex;gap:9px;flex:0 0 auto;background:var(--bg);}
.btn{flex:1;padding:12px;border-radius:11px;border:none;font-size:13.5px;font-weight:600;cursor:pointer;
  font-family:inherit;transition:.15s;}
.btn:active{opacity:.85;}
.btn.pri{background:var(--accent);color:#0A0B0C;}
.btn.gho{background:var(--surface3);color:var(--text);}
.btn:disabled{opacity:.45;}
/* 拍照 */
.cam{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.cam .opt{background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:24px 10px;text-align:center;cursor:pointer;transition:.15s;}
.cam .opt:active{border-color:var(--accent);}
.cam .opt .i{font-size:21px;display:flex;justify-content:center;color:var(--muted);}
.cam .opt svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round;}
.cam .opt .t{font-size:12px;font-weight:550;margin-top:8px;color:var(--muted);}
.preview{width:100%;border-radius:12px;display:block;max-height:180px;object-fit:cover;background:var(--surface3);}
.scan{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:12px;color:var(--muted);}
.spin{width:15px;height:15px;border-radius:99px;border:1.5px solid var(--surface3);border-top-color:var(--accent);
  animation:sp .7s linear infinite;flex:0 0 15px;}
@keyframes sp{to{transform:rotate(360deg)}}
.pbar{height:2px;border-radius:9px;background:var(--surface3);overflow:hidden;margin-top:11px;}
.pbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s;}
/* 识别结果行 */
.ritems{margin-top:18px;}
.ritem{padding:12px 0;border-bottom:1px solid var(--line);}
.ritems .ritem:last-child{border-bottom:none;padding-bottom:0;}
.ritem .top{display:flex;align-items:center;gap:8px;}
.ritem .top .ie{font-size:14px;opacity:.8;}
.ritem .top .nm{flex:1;font-size:13.5px;font-weight:550;}
.ritem .top .kk{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
.ritem .top .del{color:var(--muted2);font-size:13px;padding:0 2px;cursor:pointer;line-height:1;}
.chips{display:flex;gap:5px;margin-top:9px;}
.chip{flex:1;text-align:center;font-size:11px;font-weight:550;padding:5px 0;border-radius:7px;
  background:var(--surface2);color:var(--muted);cursor:pointer;transition:.13s;}
.chip.on{background:rgba(255,122,69,.14);color:var(--accent2);}
/* 我的：保留分组列表（设置页本来就该是列表），但压扁行高、去掉"说明副标题" */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:10px;}
.card .row{display:flex;align-items:center;gap:11px;padding:13px 15px;border-bottom:1px solid var(--line);}
.card .row:last-child{border-bottom:none;}
.card .row .k{flex:1;font-size:13.5px;font-weight:550;}
.card .row .v{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;}
.card .row .arr{color:var(--muted2);font-size:13px;}
.cardt{font-size:11px;color:var(--muted2);padding:0 2px 8px;letter-spacing:.03em;margin-top:24px;font-weight:550;}
.mrow{display:flex;align-items:center;gap:11px;padding:12px 15px;border-bottom:1px solid var(--line);cursor:pointer;}
.mrow:last-child{border-bottom:none;}
.mrow .av{width:28px;height:28px;border-radius:99px;display:grid;place-items:center;font-size:13px;flex:0 0 28px;}
.mrow .info{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.mrow .info .n{font-size:13.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mrow .info .s{font-size:11px;color:var(--muted2);font-variant-numeric:tabular-nums;white-space:nowrap;}
/* 选中态只留一个对勾：实心圆点会和头像的彩色圆形打架 */
.mrow .chk{width:16px;height:16px;display:grid;place-items:center;font-size:12px;
  color:var(--accent);flex:0 0 16px;}
input,select{font-family:inherit;}
.fld{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--text);
  padding:9px 11px;font-size:12.5px;outline:none;}
.fld:focus{border-color:var(--line2);}
.fld::placeholder{color:var(--muted2);}
/* 日期输入的原生图标默认是纯白，在深色里比正文还亮，压到 35% 刚好 */
.fld::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.35;cursor:pointer;}
input[type="date"].fld{color-scheme:dark;padding-right:6px;}
.pchip{font-size:11px;font-weight:550;padding:5px 9px;border-radius:7px;background:var(--surface2);
  color:var(--muted);cursor:pointer;white-space:nowrap;transition:.13s;border:1px solid transparent;}
.pchip.on{background:rgba(255,122,69,.14);color:var(--accent2);border-color:rgba(255,122,69,.3);}
/* 两档互斥选择用分段控件，比两行列表省一半高度 */
.seg{display:flex;gap:3px;background:var(--surface2);padding:3px;border-radius:10px;}
.seg .o{flex:1;text-align:center;padding:7px 0;border-radius:8px;font-size:12px;font-weight:550;
  color:var(--muted);cursor:pointer;transition:.15s;}
.seg .o.on{background:var(--surface3);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2);}
/* 语言不是"设置项"，是全局开关 → 页头右上角的小药丸 */
.langpill{display:flex;gap:2px;background:var(--surface2);padding:2px;border-radius:99px;}
.langpill .lp{font-size:10.5px;font-weight:600;padding:4px 8px;border-radius:99px;color:var(--muted2);
  cursor:pointer;transition:.15s;}
.langpill .lp.on{background:var(--surface3);color:var(--text);}
/* 折叠区：配置类内容默认收起 */
.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;margin-bottom:10px;}

/* ============================================================

   1. 热量只用「区间 + 三档份量」表达，不追求精确克数。
   2. 一切写入走 record 单一入口，日历只做聚合读取。
   3. 识别器可插拔：mock 与真实 API 同签名，后续换后端不改 UI。

/* ---------- 基础工具 ---------- */
const pad = n => String(n).padStart(2, '0');
const dk = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDK = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
/* 数字统一带千分位：1,800 比 1800 更容易一眼读对量级 */
const fmtNum = n => Number(n).toLocaleString('en-US');

/* Y 轴刻度：先把上限抬到"整齐"的数字，再按不超过 4 段切分。
   直接按 maxV 分四等份会得到 1337 / 2674 这种读数，没人看得懂。 */
function niceScale(rawMax, goal) {
  const wanted = Math.max(rawMax, 200) * 1.1;
  // 优先让目标值落在刻度线上：目标 1800 卡在 1k 和 2k 中间时，
  // 橙色虚线会紧贴 2k 网格线，读图的人容易把它当成 2k。命中刻度就染橙色，一眼对上。
  if (goal > 0) {
    for (const step of [900, 800, 600, 500, 400, 300, 250, 200, 100]) {
      if (goal % step) continue;
      const n = Math.ceil(wanted / step);
      if (n <= 3) return { max: n * step, step, n };
    }
  }
  for (const step of [100, 200, 250, 500, 1000]) {
    const n = Math.ceil(wanted / step);
    if (n <= 4) return { max: n * step, step, n };
  }
  const n = Math.ceil(wanted / 1000);
  return { max: n * 1000, step: 1000, n };
}
/* 轴标签要省宽度：1800 → 1.8k，3000 → 3k */
const shortK = v => v >= 1000 ? (v % 1000 ? (v / 1000).toFixed(1) : String(v / 1000)) + 'k' : String(v);

   —— 词典独立于视图代码：视图里只出现 t('key')，不出现任何三目判断。

/* 取词：找不到 key 时回退中文，再回退 key 本身，避免界面出现空白 */
function t(key, vars) {
  const pack = I18N[LANG] || I18N.zh;
  let s = pack[key];
  if (s === undefined) s = I18N.zh[key];
  if (s === undefined) s = key;
  if (typeof s === 'string' && vars) {
    s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
  }
  return s;
}
const weekNames = () => I18N[LANG].week;
const monthNames = () => I18N[LANG].months;

/* 日期格式化：中文「11月24日 周二」/ 英文「Nov 24, Tue」 */
function fmtDate(d) {
  if (LANG === 'en') return `${monthNames()[d.getMonth()]} ${d.getDate()}, ${weekNames()[d.getDay()]}`;
  return `${d.getMonth() + 1}月${d.getDate()}日 周${weekNames()[d.getDay()]}`;
}
/* 月份标题：中文「2026年11月」/ 英文「Nov 2026」 */
function fmtMonth(y, mo) {
  return t('cal.monthFmt', { y, m: monthNames()[mo] });
}
/* 食物名：英文模式用本地化译名，缺失时回退中文原名 */
const foodName = f => (LANG === 'en' && f && f.en) ? f.en : (f && f.n) || '';
const foodUnit = f => (LANG === 'en' && f && f.eu) ? f.eu : (f && f.u) || '';

/* 记录里存的是「规范中文名」（数据中性，不随语言漂移），
   显示时才按当前语言反查译名。这样切语言不会改坏历史记录，
   而库里没有的自定义食物（"妈妈做的红烧排骨"）原样显示。 */
function itemName(it) {
  if (LANG !== 'en') return it.name;
  if (it.nameEn) return it.nameEn;             // 模型直接给了英文名就用它，最准
  const f = FOOD_POOL.find(x => x.n === it.name || x.en === it.name);
  return (f && f.en) || it.name;
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ---------- 演示数据（确定性生成过去 75 天 + 今天）
   关键：不是随便堆菜，而是按「餐次预算」分配，让日总量落在目标 85%-115%，
   周末上浮 15% 制造超支模式。否则日历上会出现一堆 2.4k 的红格，一眼假。 ---------- */
function seedDemo(s) {
  const rnd = mulberry32(20261124);
  s.members.forEach(m => {
    s.records[m.id] = s.records[m.id] || {};
    for (let i = 75; i >= 0; i--) {
      const d = addDays(new Date(), -i);
      const key = dk(d);
      const isToday = i === 0;
      if (!isToday && rnd() < 0.09) continue;          // 约 9% 的日子完全没记
      const wd = d.getDay();
      const weekend = wd === 0 || wd === 6;
      const dayBudget = m.target * (weekend ? 1.15 : 0.9) * (0.85 + rnd() * 0.28);

      const share = { breakfast: 0.25, lunch: 0.4, dinner: 0.3, snack: 0.05 };
      const plan = isToday ? ['breakfast', 'lunch']
                 : weekend ? ['breakfast', 'lunch', 'dinner', 'snack']
                 : ['breakfast', 'lunch', 'dinner'];

      const meals = {};
      plan.forEach(mid => {
        if (!isToday && mid !== 'snack' && rnd() < 0.05) return;   // 偶尔漏一餐
        const pool = FOOD_POOL.filter(f => f.m.includes(mid));
        const cap = dayBudget * share[mid];
        const used = new Set();
        const arr = [];
        let acc = 0;
        for (let g = 0; g < 20 && arr.length < 4; g++) {
          const f = pool[Math.floor(rnd() * pool.length)];
          if (used.has(f.n)) continue;
          const p = rnd() < 0.7 ? PORTIONS[1] : PORTIONS[rnd() < 0.5 ? 0 : 2];
          if (arr.length && acc + f.k * p.v > cap * 1.2) continue;
          used.add(f.n);
          arr.push({ id: uid(), name: f.n, emoji: f.e, unit: f.u, baseKcal: f.k, portion: p.v, portionLabel: p.label });
          acc += f.k * p.v;
          if (acc >= cap * 0.8) break;
        }
        if (arr.length) meals[mid] = arr;
      });
      s.records[m.id][key] = meals;
    }
  });
  seedWeights(s);
}

/* 体重演示：每 2~4 天一条，整体缓慢下降 + 小幅波动。
   故意不生成「今天」——原型要让人真实走一遍手动录入，而不是一打开就发现今天已被填好。 */
function seedWeights(s) {
  const rnd = mulberry32(20261125);
  s.weights = s.weights || {};
  s.members.forEach((m, mi) => {
    if (Object.keys(s.weights[m.id] || {}).length) return;
    const start = mi === 0 ? 73.2 : 58.6;   // 不同成员不同起点，避免两条曲线一样
    const drop = mi === 0 ? 4.4 : 2.6;
    const out = {};
    let i = 74;
    while (i >= 1) {
      const key = dk(addDays(new Date(), -i));
      const prog = (74 - i) / 74;
      out[key] = Math.round((start - drop * prog + (rnd() - 0.5) * 0.6) * 10) / 10;
      i -= 2 + Math.floor(rnd() * 3);
    }
    s.weights[m.id] = out;
  });
}

/* ---------- 计算口径 ---------- */
const itemKcal = it => Math.round(it.baseKcal * it.portion);
const mealKcal = arr => (arr || []).reduce((a, it) => a + itemKcal(it), 0);
function dayMeals(memberId, key) { return (state.records[memberId] || {})[key] || {}; }
function dayTotal(memberId, key) { return MEALS.reduce((a, m) => a + mealKcal(dayMeals(memberId, key)[m.id]), 0); }
function member() { return state.members.find(m => m.id === state.currentMemberId) || state.members[0]; }
// 区间：模型/档位本身就是估算，统一给 ±15% 表达，避免"1873"这种假精确
function dayRange(total) { return [Math.round(total * 0.85 / 10) * 10, Math.round(total * 1.15 / 10) * 10]; }
/* ---------- 体重 ---------- */
const weightMap = id => state.weights[id] || {};

/* 取窗口内的体重记录（按日期升序）。窗口内不足 2 条时退化为「最近 8 条」，
   否则刚用几天的人看到的是一条点不成的线。 */
function weightSeries(memberId, days) {
  const all = weightMap(memberId);
  const keys = Object.keys(all).filter(k => +all[k] > 0).sort();
  const t1 = parseDK(dk(new Date())).getTime();
  const t0 = t1 - ((days || 30) - 1) * 864e5;
  let arr = keys.filter(k => parseDK(k).getTime() >= t0);
  if (arr.length < 2) arr = keys.slice(-8);
  return arr.map(k => ({ key: k, kg: +all[k] }));
}
/* 相对首条的变化量。用「首条→末条」而不是「前一天」，因为体重是稀疏数据 */
function weightDelta(arr) {
  if (arr.length < 2) return null;
  return Math.round((arr[arr.length - 1].kg - arr[0].kg) * 10) / 10;
}
const fmtKg = v => (v > 0 ? '+' : '') + v.toFixed(1);
const dltCls = d => (d === null ? 'flat' : d < 0 ? 'down' : d > 0 ? 'up' : 'flat');

/* 折线图。viewBox 固定比例（不做 preserveAspectRatio="none"），
   否则 <text> 和圆点会被横向拉伸变形。 */
function weightChart(memberId, days, H) {
  const arr = weightSeries(memberId, days);
  const h = H || 96;
  if (!arr.length) {
    return `<div class="wempty">${t('wt.empty')}</div>`;
  }

  const vals = arr.map(p => p.kg);
  const mn = Math.min(...vals), mx = Math.max(...vals);
  /* 三档刻度，中心吸到 0.5 的倍数，跨度取 2*step —— 这样三个数字都是整的
     （69.0 / 70.0 / 71.0），不会出现 70.8 / 69.8 / 68.8 这种像随机数的刻度。
     同时保证可见跨度至少 2kg：真实称重日间波动 0.3-0.6kg 很正常，
     按实际跨度铺满整张图会把正常波动画成"暴涨暴跌"，那是假信号。 */
  const gh = (mn + mx) / 2;
  const mid = Math.round(gh * 2) / 2;
  const need = Math.max((mx - mn) * 1.35, 2);
  const step = need <= 1 ? 0.5 : need <= 2 ? 1 : need <= 4 ? 2 : need <= 8 ? 4 : 8;
  let lo = mid - step, hi = mid + step;
  while (lo > mn || hi < mx) { lo -= step; hi += step; }   // 取整后数据仍要落在框内

  const ts = arr.map(p => parseDK(p.key).getTime());
  let t0 = ts[0], t1 = ts[ts.length - 1];
  if (t1 === t0) { t0 -= 864e5; t1 += 864e5; }      // 单点也要有横向跨度

  const W = 300, PX = 30, PR = 6, PY = 9;
  const px = ms => PX + ((ms - t0) / (t1 - t0)) * (W - PX - PR);
  const py = kg => PY + (1 - (kg - lo) / (hi - lo)) * (h - PY * 2);

  const pts = arr.map(p => {
    const x = px(parseDK(p.key).getTime());
    return { x: +x.toFixed(1), y: +py(p.kg).toFixed(1), kg: p.kg, key: p.key };
  });

  // Y 轴三档网格（取到 0.1，不硬凑整数——体重本来就会是 68.4 这种数）
  const grid = [lo, mid, hi].map(v => ({ v: Math.round(v * 10) / 10, y: +py(v).toFixed(1) }));
  const gridHtml = grid.map(g =>
    `<line x1="${PX}" y1="${g.y}" x2="${W - PR}" y2="${g.y}" stroke="rgba(255,255,255,.1)" stroke-width="1"/>
     <text x="${PX - 5}" y="${g.y + 3}" text-anchor="end" fill="#5E6678" font-size="8.5">${g.v.toFixed(1)}</text>`
  ).join('');

  const line = pts.map((p, i) => (i ? 'L' : 'M') + p.x + ' ' + p.y).join(' ');
  // 线下渐变填充贴到绘图区底部，不是贴到 SVG 底部（否则会盖住 Y 轴标签区）
  const baseY = (h - PY).toFixed(1);
  const area = pts.length > 1
    ? `M${pts[0].x} ${baseY} L${pts.map(p => p.x + ' ' + p.y).join(' L')} L${pts[pts.length - 1].x} ${baseY} Z`
    : '';
  const dots = pts.map((p, i) => {
    const last = i === pts.length - 1;
    return `<circle cx="${p.x}" cy="${p.y}" r="${last ? 3.4 : 2.2}"
      fill="${last ? '#FF7A45' : '#16191F'}" stroke="${last ? '#16191F' : '#FFB088'}" stroke-width="${last ? 2 : 1.4}"/>`;
  }).join('');

  // aspect-ratio 必须显式给：只写 height:auto 时，innerHTML 重建的瞬间浏览器
  // 还没算出 SVG 高度，scrollHeight 会少掉一整块，恢复滚动位置就会被压到更小的值。
  return `<svg viewBox="0 0 ${W} ${h}" width="100%"
      style="display:block;height:auto;aspect-ratio:${W}/${h}" role="img"
      aria-label="${t('wt.title')}">
    <defs>
      <linearGradient id="wg${H || ''}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FF7A45" stop-opacity=".22"/>
        <stop offset="100%" stop-color="#FF7A45" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${gridHtml}
    ${area ? `<path d="${area}" fill="url(#wg${H || ''})"/>` : ''}
    ${pts.length > 1 ? `<path d="${line}" fill="none" stroke="#FF7A45" stroke-width="2"
        stroke-linejoin="round" stroke-linecap="round"/>` : ''}
    ${dots}
  </svg>`;
}

const fmtMD = key => { const d = parseDK(key); return (d.getMonth() + 1) + '/' + d.getDate(); };

/* 餐次名与份量标签的本地化出口：视图里不再直接读 meal.name / portion.label */
const mealOf = id => MEALS.find(x => x.id === id) || MEALS[3];
const mealName = id => (LANG === 'en' ? mealOf(id).en : mealOf(id).name);
const portionLabel = p => t((PORTIONS.find(x => Math.abs(x.v - p) < 0.01) || PORTIONS[1]).lk);
/* 成员名是用户数据：只有内置的演示成员带英文名，自己添加的原样显示 */
const memberName = mm => (LANG === 'en' && mm.en) ? mm.en : mm.name;

function dayStatus(total, target) {
  if (!total) return 'none';
  const r = total / target;
  if (r < 0.8) return 'under';
  if (r <= 1.05) return 'near';
  return 'over';
}

// 之前只绑 app，而 tabbar 是 app 的兄弟节点 —— 所以点底部导航永远没反应。
const root = document.getElementById('phone');

function render(keepScroll) {
  const m = member();
  const sc = keepScroll ? app.scrollTop : 0;
  syncDocLang();
  if (view.tab === 'today') app.innerHTML = viewToday(m);
  else if (view.tab === 'calendar') app.innerHTML = viewCalendar(m);
  else app.innerHTML = viewMe(m);
  renderTabbar();
  app.scrollTop = sc;

  // 直接设 scrollTop 会被浏览器压到更小的值。下一帧再校一次。
  if (keepScroll) requestAnimationFrame(() => { app.scrollTop = sc; });
  if (view.sheet) renderSheet();
}

/* 语言切换要同步到文档本身：<html lang> 影响排版断行，title 影响浏览器标签页 */

/* ---------- 视图：今日 ----------
   一屏只回答一个问题：今天还能吃多少。
   所以这里没有环形图、没有鼓励语、没有"还没记录"的占位文案 ——
   大数字 + 一根细线 + 每餐三行，就够读懂。 */
function viewToday(m) {
  const key = view.dateKey;
  const total = dayTotal(m.id, key);
  const [lo, hi] = dayRange(total);
  const left = m.target - total;
  const pct = clamp(total / m.target, 0, 1);
  const d = parseDK(key);
  const isToday = key === dk(new Date());

  const mealsHtml = MEALS.map(meal => {
    const arr = dayMeals(m.id, key)[meal.id] || [];
    const k = mealKcal(arr);
    const rows = arr.map(it => `
      <div class="item">
        <div class="ie">${it.emoji || '🍽'}</div>
        <div class="in">
          <div class="n">${esc(itemName(it))}</div>
          <div class="p">${portionLabel(it.portion)}</div>
        </div>
        <div class="ik">${itemKcal(it)}</div>
        <div class="del" data-act="delItem" data-meal="${meal.id}" data-id="${it.id}">×</div>
      </div>`).join('');
    return `<div class="meal">
      <div class="meal-h">
        <div class="nm">${mealName(meal.id)}</div>
        <div class="kk">${k ? k : ''}</div>
        <div class="add" data-act="openCam" data-meal="${meal.id}">＋</div>
      </div>
      ${arr.length ? rows : `<div class="addline" data-act="openCam" data-meal="${meal.id}">＋</div>`}
    </div>`;
  }).join('');

  return `<div class="page">
    <div class="head">
      <div class="d2">${fmtDate(d)}${isToday ? ' · ' + t('c.today') : ''}</div>
      <div class="mchip" data-act="switchMember">
        <div class="mav" style="background:${m.color}">${m.emoji}</div>
        <span>${esc(memberName(m))}</span>
      </div>
    </div>

    <div class="summary">
      <div class="big"${left < 0 ? ' style="color:var(--over)"' : ''}>${fmtNum(Math.abs(left))}</div>
      <div class="lab">${left >= 0 ? t('today.left') : t('today.over')}</div>
      <div class="meter"><i style="width:${pct * 100}%"></i></div>
      <div class="meta">
        <span>${t('today.intake')} <b>${total ? fmtNum(lo) + '–' + fmtNum(hi) : '—'}</b></span>

/* 体重卡片：放在日历页最底部，和热量趋势同屏对照（吃得少到底有没掉秤） */
function weightCard(m) {
  const arr = weightSeries(m.id, 30);
  const cur = arr.length ? arr[arr.length - 1].kg : null;
  const dl = weightDelta(arr);
  const cls = dltCls(dl);

  return `<div class="sec"><h3>${t('wt.title')}</h3>

        ${dl === null ? '' : `<div class="wdlt ${cls}">${fmtKg(dl)} kg</div>`}
      </div>`}
      ${weightChart(m.id, 30, 96)}

function viewCalendar(m) {
  const y = view.calYear, mo = view.calMonth;
  const first = new Date(y, mo, 1);
  const startPad = first.getDay();
  const days = new Date(y, mo + 1, 0).getDate();
  const nowD = new Date();
  const todayKey = dk(nowD);
  const atNow = y === nowD.getFullYear() && mo === nowD.getMonth();

  let cells = '';
  for (let i = 0; i < startPad; i++) cells += `<div class="cell blank"></div>`;
  let recDays = 0, okDays = 0, sum = 0;
  for (let d = 1; d <= days; d++) {
    const key = `${y}-${pad(mo + 1)}-${pad(d)}`;
    const t = dayTotal(m.id, key);
    const st = dayStatus(t, m.target);
    if (t) { recDays++; sum += t; }
    if (st === 'near') okDays++;
    // 未来的格子不给点：还没发生的事没法记录，能点开只会让人以为记错了
    const future = key > todayKey;
    const cls = ['cell', t ? 'has' : '', st !== 'none' ? st : '',
      key === todayKey ? 'today' : '', future ? 'future' : ''].filter(Boolean).join(' ');
    cells += `<div class="${cls}"${future ? '' : ` data-act="openDay" data-key="${key}"`}>
      <div class="dn">${d}</div>
      <div class="k">${t ? (t > 999 ? (t / 1000).toFixed(1) + 'k' : t) : ''}</div>
    </div>`;
  }

  // 近 7 日
  const bars = [];
  let maxV = 0;
  for (let i = 6; i >= 0; i--) {
    const d = addDays(new Date(), -i);
    const key = dk(d);
    const t = dayTotal(m.id, key);
    if (t > maxV) maxV = t;
    bars.push({ key, d, t });
  }

  // 刻度上限至少覆盖「目标值」，否则目标线会跑到图外
  const scale = niceScale(Math.max(maxV, m.target), m.target);
  const pos = v => clamp((v / scale.max) * 100, 0, 100);
  const ticks = [];
  for (let v = 0; v <= scale.max; v += scale.step) ticks.push(v);

  const gridHtml = ticks.map(v =>
    `<div class="gl ${v === 0 ? 'zero' : ''}" style="bottom:${pos(v)}%"></div>`).join('');

  // 目标值恰好落在刻度上时染成橙色，等于免费多标一个目标刻度；
  // 没落在刻度上就不硬塞标签（会和邻近刻度挤在一起），靠橙色虚线 + 标题文字说明。
  const yHtml = ticks.map(v => {
    const isGoal = Math.abs(v - m.target) < scale.step * 0.05;
    return `<div class="yt ${isGoal ? 'goal' : ''}" style="bottom:${pos(v)}%">${shortK(v)}</div>`;
  }).join('');

  const barsHtml = bars.map(b => {
    const st = dayStatus(b.t, m.target);
    const tip = `${b.key}${b.t ? ' · ' + t('c.approx') + ' ' + b.t + ' kcal' : ' · ' + t('cal.noData')}`;
    const inner = b.t
      ? `<div class="b ${st}" style="height:${Math.max(3, pos(b.t))}%"></div>`
      : `<i class="nodata"></i>`;
    return `<div class="col" title="${tip}">${inner}</div>`;
  }).join('');

  const xHtml = bars.map(b => `<span>${weekNames()[b.d.getDay()]}</span>`).join('');
  const avg = recDays ? Math.round(sum / recDays) : 0;

  return `<div class="page">
    <div class="calhead">
      <div class="m">${fmtMonth(y, mo)}<span>· ${esc(memberName(m))}</span></div>
      <div style="display:flex;gap:2px">
        <div class="navb" data-act="calPrev">‹</div>
        <div class="navb ${atNow ? 'off' : ''}" data-act="calNext">›</div>
      </div>
    </div>
    <div class="wk">${weekNames().map(w => `<div>${w}</div>`).join('')}</div>
    <div class="grid">${cells}</div>

    <div class="mstats">
      <span>${t('cal.recDays')} <b>${recDays}</b></span>
      <span>${t('cal.okDays')} <b style="color:var(--warn)">${okDays}</b></span>
      <span>${t('cal.avgDay')} <b>${avg ? fmtNum(avg) : '—'}</b></span>
    </div>

    <div class="sec"><h3>${t('cal.last7')}</h3>
      <span class="act" style="cursor:default">
        <i style="display:inline-block;width:14px;border-top:1px dashed rgba(251,191,36,.7)"></i>${t('c.target')} ${fmtNum(m.target)}
      </span>
    </div>
    <div class="chart">
      <div class="plotwrap">
        <div class="yaxis">${yHtml}</div>
        <div class="plot">
          ${gridHtml}
          <div class="goalline" style="bottom:${pos(m.target)}%"></div>
          <div class="cols">${barsHtml}</div>
        </div>
      </div>
      <div class="xlabels" style="margin-left:30px">${xHtml}</div>
    </div>

    ${weightCard(m)}
  </div>`;
}

/* ---------- 交互动作 ---------- */
// 绑在 #phone 上（app 与 tabbar 的共同祖先），底部导航才能被点到
root.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const key = el.dataset.key;
  const meal = el.dataset.meal;
  const id = el.dataset.id;

  switch (act) {
    case 'tab': view.tab = id; render(); break;
    // 语言切换：LANG 是全局渲染依据，改完必须重渲染整页 + 同步 <html lang>
    case 'setLang': {
      if (!LANGS.some(l => l.id === id)) break;
      LANG = id;
      state.settings.lang = id;
      document.documentElement.lang = id === 'en' ? 'en' : 'zh-CN';
      save();
      render(true);
      toast(id === 'en' ? t('toast.langEn') : t('toast.langZh'));
      break;
    }
    // 「我的」页两处折叠：只改 view 里的开关再重渲染，并保住滚动位置
    case 'toggleApi': view.me.api = !view.me.api; render(true); break;
    case 'toggleData': view.me.data = !view.me.data; render(true); break;
    case 'openCam': view.sheet = { type: 'cam', meal }; renderSheet(); break;
    case 'openQuick': view.sheet = { type: 'quick', meal: guessMeal() }; renderSheet(); break;
    case 'openWeight': view.sheet = { type: 'weight' }; renderSheet(); break;
    case 'calPrev':
      view.calMonth--; if (view.calMonth < 0) { view.calMonth = 11; view.calYear--; } render(); break;
    // 已经在当月就没有「下个月」可看：未来还没发生，日历只往回走
    case 'calNext': {
      const n = new Date();
      if (view.calYear === n.getFullYear() && view.calMonth === n.getMonth()) break;
      view.calMonth++; if (view.calMonth > 11) { view.calMonth = 0; view.calYear++; }
      render(); break;
    }
    // 点日历格子 → 弹出当天详情，而不是粗暴地跳走整页
    // （之前跳 tab 时，若点的是"今天"，页面看起来毫无变化，用户会以为点不动）
    case 'openDay': view.sheet = { type: 'dayDetail', key }; renderSheet(); break;
    case 'switchMember': view.sheet = { type: 'members' }; renderSheet(); break;
    case 'pickMember':
      state.currentMemberId = id; save(); view.sheet = null; closeSheet(); render(); break;
    case 'addMember': addMember(); break;
    case 'saveVision': saveVision(); break;
    case 'testVision': testVision(); break;
    case 'setProvider': setProvider(id); break;
    case 'setEngine':
      state.settings.engine = id; save();
      toast(id === 'local' ? t('toast.engineLocal') : t('toast.engineCloud'));
      render(); break;
    case 'exportData': exportData(); break;
    case 'resetData': resetData(); break;
    case 'delItem': {
      const arr = dayMeals(state.currentMemberId, view.dateKey)[meal];
      const i = arr ? arr.findIndex(x => x.id === id) : -1;
      if (i < 0) break;
      const it = arr[i];
      ask(t('cfm.delItem'), `${itemName(it)} · ${itemKcal(it)} kcal`).then(ok => {
        if (!ok) return;
        arr.splice(i, 1);
        save(); render(); toast(t('toast.deleted'));
      });
      break;
    }
    case 'cfmYes': answerCfm(true); break;
    case 'cfmNo': answerCfm(false); break;
    case 'closeSheet': closeSheet(); break;
  }
});

/* 按当前时间猜餐次，省掉一次"这是哪一餐"的选择 */
function guessMeal() {
  const h = new Date().getHours();
  if (h < 10) return 'breakfast';
  if (h < 15) return 'lunch';
  if (h < 21) return 'dinner';
  return 'snack';
}

/* 加成员：原型用 prompt 简化，正式版应做成独立表单页 */
function addMember() {
  const name = (window.prompt(t('prompt.newMember')) || '').trim();
  if (!name) return;
  const colors = [
    'linear-gradient(140deg,#7DD3FC,#3B82F6)',
    'linear-gradient(140deg,#C4B5FD,#8B5CF6)',
    'linear-gradient(140deg,#FDE68A,#F59E0B)'
  ];
  const id = 'm' + uid();
  state.members.push({ id, name, emoji: '🙂', target: 1800, color: colors[state.members.length % colors.length] });
  state.records[id] = {};
  state.currentMemberId = id;
  save(); render();
  toast(t('toast.addedMember', { n: name }));
}

window.setTarget = function (v) {
  member().target = v; save(); toast(t('toast.targetUpdated'));
};

/* 表单草稿：折叠时输入框不在 DOM 里，下一次渲染靠它把内容填回去，
   否则"填了 Key → 收起来 → 再展开"会把刚打的字全丢掉。 */
window.visionDraft = function (k, v) {
  if (!view.vdraft) view.vdraft = { base: '', key: '', model: '' };
  view.vdraft[k] = v;
};

function readVisionForm() {
  const v = Object.assign({ base: '', key: '', model: '' }, view.vdraft || {});
  const g = (id, k) => { const el = document.getElementById(id); if (el) v[k] = el.value.trim(); };
  g('fBase', 'base'); g('fKey', 'key'); g('fModel', 'model');
  return { base: v.base || '', key: v.key || '', model: v.model || '' };
}

/* 切换预设：先保住用户已经打进去的 Key，再覆盖地址和模型名 */
function setProvider(id) {
  const p = VISION_PRESETS[id];
  if (!p) return;
  const cur = readVisionForm();
  state.settings.vision = {
    provider: id,
    base: p.base || cur.base,
    key: cur.key,
    model: p.model || cur.model
  };
  view.vdraft = { base: state.settings.vision.base, key: cur.key, model: state.settings.vision.model };
  save(); render(true);
  toast(p.base ? t('toast.providerFilled', { n: presetShort(p) }) : t('toast.customMode'));
}

function saveVision() {
  const v = readVisionForm();
  const prev = state.settings.vision || {};
  state.settings.vision = { provider: prev.provider || 'custom', base: v.base, key: v.key, model: v.model };
  view.vdraft = { base: v.base, key: v.key, model: v.model };
  save(); render(true);
  toast(v.base && v.key ? t('toast.visionSaved') : t('toast.visionCleared'));
}

/* 测试连接：发一个 max_tokens=1 的最小请求，只为验证地址/Key/模型名三者对不对。
   在浏览器里失败率很高，因为跨域 —— 这不是配置错，要跟用户讲清楚。 */
async function testVision() {
  const out = document.getElementById('testOut');
  if (!out) return;
  const v = readVisionForm();
  if (!v.base) { out.textContent = '先把接口地址填上'; out.style.color = 'var(--warn)'; return; }
  if (!v.key) { out.textContent = 'Key 还没填。云端接口必须填 Key，否则没法验证。'; out.style.color = 'var(--warn)'; return; }
  if (!v.model) { out.textContent = '模型名还没填'; out.style.color = 'var(--warn)'; return; }

  out.textContent = '正在请求…'; out.style.color = 'var(--muted)';
  const t0 = performance.now();
  try {
    const res = await fetch(v.base.replace(/\/+$/, '') + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + v.key },
      body: JSON.stringify({ model: v.model, messages: [{ role: 'user', content: 'ping' }], max_tokens: 1 })
    });
    const ms = Math.round(performance.now() - t0);
    if (res.ok) {
      out.textContent = `连通 ✓ 往返 ${ms}ms`;
      out.style.color = 'var(--ok)';
      return;
    }
    let extra = '';
    if (res.status === 401 || res.status === 403) extra = 'Key 无效或没有该模型权限';
    else if (res.status === 404) extra = '地址不对，或模型名不存在';
    else if (res.status === 400) extra = '多半是模型名不对（火山的要填 ep- 开头的接入点）';
    else if (res.status === 429) extra = '触发限流，稍后再试';
    else extra = (await res.text().catch(() => '')).slice(0, 70);
    out.textContent = `HTTP ${res.status} · ${extra}`;
    out.style.color = 'var(--over)';
  } catch (e) {
    out.textContent = '连不上：被浏览器跨域（CORS）拦了，或者本机服务没起来。网页里失败是常态，不算你配置错。';
    out.style.color = 'var(--warn)';
  }
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `calorie-backup-${dk(new Date())}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(t('toast.exported'));
}

function resetData() {
  ask(t('cfm.reset'), t('cfm.resetSub'), t('me.reset')).then(ok => {
    if (!ok) return;
    state = DEFAULT_STATE(); seedDemo(state);
    state.currentMemberId = 'm1'; save(); render(); toast(t('toast.reset'));
  });
}

/* ---------- Sheet ---------- */
let sheetEl = null;
// 弹层里改过数据（如体重）时置位：关闭弹层要刷新主页面，否则主页显示的还是旧值
let dirtyMain = false;

function closeSheet() {
  view.sheet = null;
  if (sheetEl) { sheetEl.remove(); sheetEl = null; }
  // 保持滚动位置：用户是从日历页底部点开的体重卡，刷新后跳回顶部会很突兀
  if (dirtyMain) { dirtyMain = false; render(true); }
}

function renderSheet() {
  if (sheetEl) { sheetEl.remove(); sheetEl = null; }
  if (!view.sheet) return;
  const s = view.sheet;
  const mask = document.createElement('div');
  mask.className = 'mask';
  mask.addEventListener('click', ev => { if (ev.target === mask) closeSheet(); });

  // 注意：没有分支的类型必须直接 return，绝不能挂一个空的面板上去
  // —— 空面板会挡住整屏，用户只会看到"点了没反应"。
  if (s.type === 'cam' || s.type === 'quick') mask.innerHTML = sheetCam(s);
  else if (s.type === 'dayDetail') mask.innerHTML = sheetDay(s.key);
  else if (s.type === 'pickMeal') mask.innerHTML = sheetPickMeal(s);
  else if (s.type === 'members') mask.innerHTML = sheetMembers(s);
  else if (s.type === 'weight') mask.innerHTML = sheetWeight();
  else return;

  document.getElementById('phone').appendChild(mask);
  sheetEl = mask;
  bindSheetEvents(mask, s);

  // "手动添加"直接落到食物库，不让人再多点一次
  if (s.type === 'quick') openManualEntry(s.meal, mask, null);
}

/* 体重录入。同一天只存一条：早上称和晚上称差 0.5kg，存多条只会让曲线更乱。
   保存即覆盖，UI 在覆盖前不做二次确认（体重是随手记的数据，多一步就让人不想记）。 */
function saveWeight() {
  const dEl = document.getElementById('wDate');
  const vEl = document.getElementById('wVal');
  const key = (dEl && dEl.value) || dk(new Date());
  const raw = ((vEl && vEl.value) || '').trim().replace(',', '.');
  const kg = parseFloat(raw);
  if (!raw || !isFinite(kg)) { toast(t('wt.needVal')); return; }
  if (kg < 30 || kg > 200) { toast(t('wt.badVal')); return; }
  const val = Math.round(kg * 10) / 10;
  const mid = state.currentMemberId;
  state.weights[mid] = state.weights[mid] || {};
  state.weights[mid][key] = val;
  save();
  dirtyMain = true;      // 关闭时刷新日历页，否则卡上还是旧体重
  closeSheet();
  toast(t('wt.saved', { n: val.toFixed(1) }));
}

function delWeight(key) {
  const mid = state.currentMemberId;
  const val = (state.weights[mid] || {})[key];
  ask(t('cfm.delWeight'), `${fmtMD(key)} · ${(+val).toFixed(1)} ${t('wt.unit')}`).then(ok => {
    if (!ok) return;
    if (state.weights[mid]) delete state.weights[mid][key];
    save();
    dirtyMain = true;
    renderSheet();       // 保持弹层打开，方便连着删掉误记的几条
    toast(t('toast.deleted'));
  });
}

function bindSheetEvents(mask, s) {
  mask.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]');
    if (el) {
      const act = el.dataset.act;
      if (act === 'closeSheet') { closeSheet(); return; }
      if (act === 'pickMember') {
        state.currentMemberId = el.dataset.id; save(); closeSheet(); render(); return;
      }
      if (act === 'pickMealFor') {
        view.dateKey = el.dataset.key;
        view.sheet = { type: 'cam', meal: el.dataset.meal };
        renderSheet(); return;
      }
      if (act === 'addToDay') {
        view.sheet = { type: 'pickMeal', key: el.dataset.key };
        renderSheet(); return;
      }
      if (act === 'jumpDay') {
        view.dateKey = el.dataset.key; view.tab = 'today';
        closeSheet(); render(); return;
      }
      if (act === 'openCam') {
        view.sheet = { type: 'cam', meal: el.dataset.meal };
        renderSheet(); return;
      }
      if (act === 'saveWeight') { saveWeight(); return; }
      if (act === 'delWeight') { delWeight(el.dataset.key); return; }
      return;
    }
    if (ev.target.id === 'btnManual') { openManualEntry(s.meal, mask, null); }
  });

  if (s.type === 'cam') {
    const fc = mask.querySelector('#fileCamera');
    const fa = mask.querySelector('#fileAlbum');
    [fc, fa].forEach(inp => inp && inp.addEventListener('change', async e => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const dataUrl = await fileToDataUrl(f);
      runRecognition(s.meal, dataUrl, mask);
    }));
  }
}

function fileToDataUrl(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

/* ---------- 识别：统一入口（mock / 真实同签名） ---------- */
async function runRecognition(mealId, dataUrl, mask) {
  const body = mask.querySelector('#camBody');
  const sub = mask.querySelector('#camSub');

  // 本地食物库模式：不调任何模型，选完图直接让人点。0 延迟、100% 可控。
  if ((state.settings.engine || 'cloud') === 'local') {
    sub.textContent = t('rec.localMode');
    openManualEntry(mealId, mask, dataUrl);
    return;
  }

  body.innerHTML = `
    <img class="preview" src="${dataUrl}" alt="待识别照片">
    <div class="scan"><div class="spin"></div><span id="scanTxt">${t('rec.recognizing')}</span></div>
    <div class="pbar"><i id="pbar" style="width:8%"></i></div>`;

  const steps = t('steps');
  let i = 0;
  const pbar = () => mask.querySelector('#pbar');
  const timer = setInterval(() => {
    i = Math.min(i + 1, steps.length - 1);
    const stp = mask.querySelector('#scanTxt');
    if (stp) stp.textContent = steps[i];
    const p = pbar(); if (p) p.style.width = `${20 + i * 22}%`;
  }, 380);

  let items = null, err = null;
  try {
    items = await recognize(dataUrl);
  } catch (e) {
    err = e;
  }
  clearInterval(timer);
  if (!mask.isConnected) return;

  if (!items || !items.length) {
    sub.textContent = t('rec.failed');
    if (err) toast(String(err.message || t('rec.failMsg')).slice(0, 26));
    openManualEntry(mealId, mask, dataUrl);
    return;
  }
  sub.textContent = t('rec.confirm');
  showResult(mealId, dataUrl, items, mask);
}

function showResult(mealId, dataUrl, items, mask) {
  const body = mask.querySelector('#camBody');
  const foot = mask.querySelector('.sh-f');
  const mealTitle = mealName(mealId);
  const render = () => {
    const sum = items.reduce((a, it) => a + Math.round(it.baseKcal * it.portion), 0);
    body.innerHTML = `
      <img class="preview" src="${dataUrl}" alt="照片">
      <div class="ritems">
      ${items.map((it, idx) => `
        <div class="ritem">
          <div class="top">
            <div class="ie">${it.emoji || '🍽'}</div>
            <div class="nm">${esc(itemName(it))}</div>
            <div class="kk">${Math.round(it.baseKcal * it.portion)}</div>
            <div class="del" data-del="${idx}">✕</div>
          </div>
          <div class="chips">
            ${PORTIONS.map(p => `<div class="chip ${Math.abs(it.portion - p.v) < 0.01 ? 'on' : ''}"
              data-p="${p.v}" data-idx="${idx}">${t(p.lk)}</div>`).join('')}
          </div>
        </div>`).join('')}
      </div>
      <div class="sum"><span>${t('rec.total')}</span><span>${t('c.approx')} <b>${sum}</b> kcal</span></div>`;

    body.querySelectorAll('[data-p]').forEach(c => c.addEventListener('click', () => {
      const idx = +c.dataset.idx;
      items[idx].portion = +c.dataset.p;
      items[idx].portionLabel = PORTIONS.find(p => p.v === +c.dataset.p).label;
      render();
    }));
    body.querySelectorAll('[data-del]').forEach(d => d.addEventListener('click', () => {
      items.splice(+d.dataset.del, 1);
      if (!items.length) { closeSheet(); return; }
      render();
    }));
    if (foot) foot.innerHTML = `
      <button class="btn gho" data-act="closeSheet">${t('c.cancel')}</button>
      <button class="btn pri" id="btnConfirm">${t('rec.addTo', { meal: mealTitle })}</button>`;
    const bc = foot && foot.querySelector('#btnConfirm');
    if (bc) bc.addEventListener('click', () => commit(mealId, items));
  };
  render();
}

function commit(mealId, items) {
  const key = view.dateKey;
  const mid = state.currentMemberId;
  state.records[mid] = state.records[mid] || {};
  state.records[mid][key] = state.records[mid][key] || {};
  const arr = state.records[mid][key][mealId] || (state.records[mid][key][mealId] = []);
  items.forEach(it => arr.push({
    id: uid(), name: it.name, emoji: it.emoji || '🍽', unit: it.unit || '',
    baseKcal: it.baseKcal, portion: it.portion, portionLabel: it.portionLabel || '正常'
  }));
  save(); closeSheet();
  const total = dayTotal(mid, key);
  toast(t('toast.logged', { n: total }));
  if (view.tab !== 'today') { view.tab = 'today'; view.dateKey = key; }
  render();
}

/* ---------- 识别器实现 ---------- */
const VISION_PROMPT = `你是中餐营养估算助手。识别图中所有食物，只输出 JSON，不要任何解释文字。
格式：{"items":[{"name":"食物名","nameEn":"English name","portion":"少/正常/多","kcal":整数,"unit":"一碗/一盘/一个"}]}
规则：
1. 按中式常见家常做法估算，含烹饪油；
2. kcal 是"正常份量"下的估算值，不是精确值，不必过度纠结；
3. 最多 5 项，合并同类；
4. 看不清或不确定时，按偏高的保守值给，并降低 confidence。`;

async function recognize(dataUrl) {
  const cfg = state.settings.vision || {};
  if (cfg.base && cfg.key) return recognizeReal(dataUrl, cfg);
  return recognizeMock();
}

function recognizeMock() {
  return new Promise(resolve => {
    setTimeout(() => {
      const mealId = view.sheet && view.sheet.meal || 'lunch';
      const pool = FOOD_POOL.filter(f => f.m.includes(mealId));
      const src = pool.length ? pool : FOOD_POOL;
      const n = 2 + Math.floor(Math.random() * 2);
      const used = new Set();
      const items = [];
      for (let i = 0; i < n; i++) {
        const f = src[Math.floor(Math.random() * src.length)];
        if (used.has(f.n)) continue;
        used.add(f.n);
        const p = PORTIONS[Math.floor(Math.random() * 3)];
        items.push({ name: f.n, emoji: f.e, unit: f.u, baseKcal: f.k, portion: p.v, portionLabel: p.label });
      }
      resolve(items);
    }, 1400);
  });
}

async function recognizeReal(dataUrl, cfg) {
  const url = cfg.base.replace(/\/+$/, '') + '/chat/completions';
  const body = {
    model: cfg.model || 'qwen-vl-plus',
    temperature: 0.2,
    messages: [{
      role: 'user',
      content: [
        { type: 'text', text: VISION_PROMPT },
        { type: 'image_url', image_url: { url: dataUrl } }
      ]
    }]
  };
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 25000);
  let res;
  try {
    res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.key },
      body: JSON.stringify(body),
      signal: ctrl.signal
    });
  } catch (e) {
    throw new Error('请求失败（可能是跨域被拦，需要一层自己的代理）');
  } finally { clearTimeout(t); }
  if (!res.ok) throw new Error(`接口返回 ${res.status}`);
  const json = await res.json();
  const text = json.choices?.[0]?.message?.content || '';
  return parseVisionJson(text);
}

function parseVisionJson(text) {
  if (typeof text === 'string' && Array.isArray(text)) text = text.join('');
  let s = String(text).trim();
  const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (fence) s = fence[1].trim();
  const start = s.indexOf('{'), end = s.lastIndexOf('}');
  if (start >= 0 && end > start) s = s.slice(start, end + 1);
  let obj;
  try { obj = JSON.parse(s); } catch (e) { throw new Error('模型没返回合法 JSON'); }
  const list = obj.items || obj.foods || [];
  return list.map(it => {
    const name = it.name || '未命名';
    const k = Math.round(Number(it.kcal || it.calorie || 0)) || 200;
    const pmap = { '少': 0.7, '正常': 1, '适中': 1, '多': 1.35, '较多': 1.35, '少量': 0.7 };
    const pv = pmap[it.portion] || 1;
    const emoji = (FOOD_POOL.find(f => name.includes(f.n) || f.n.includes(name)) || {}).e || '🍽';
    return {
      name, nameEn: it.nameEn || it.name_en || '', emoji, unit: it.unit || '',
      baseKcal: Math.round(k / pv), portion: pv,
      portionLabel: PORTIONS.find(p => p.v === pv).label
    };
  }).filter(x => x.baseKcal > 0);
}

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('on'), 1900);
}

/* ---------- 二次确认 ----------
   删除不可撤销，统一先问一句。用页面内的卡片而不是原生 confirm：
   原生弹窗会整块跳出这套视觉语言，也不在手机框里居中。
   调用方拿到 Promise<boolean>，删除逻辑写在 .then 里，不需要额外的状态机。 */
let cfmResolve = null;
function ask(title, sub, okText) {
  // 连点两次删除时，先把上一个问句按「取消」结掉，否则那个 Promise 永远悬着
  if (cfmResolve) answerCfm(false);
  const box = document.getElementById('cfm');
  box.querySelector('.cfm-t').textContent = title;
  box.querySelector('.cfm-s').textContent = sub || '';
  box.querySelector('[data-act="cfmYes"]').textContent = okText || t('c.delete');
  box.querySelector('[data-act="cfmNo"]').textContent = t('c.cancel');
  box.hidden = false;
  void box.offsetWidth;                 // 强制一次 layout，否则 .on 的过渡不会触发
  box.classList.add('on');
  return new Promise(res => { cfmResolve = res; });
}
function answerCfm(ok) {
  const box = document.getElementById('cfm');
  if (box.hidden) return;
  box.classList.remove('on');
  setTimeout(() => { box.hidden = true; }, 140);   // 等淡出，避免闪一下就消失
  const r = cfmResolve; cfmResolve = null;
  if (r) r(ok);
}
// 点遮罩 = 取消；Esc / Enter 也能答，键盘用户不用去够按钮
document.getElementById('cfm').addEventListener('click', e => {
  if (e.target.id === 'cfm') answerCfm(false);
});
document.addEventListener('keydown', e => {
  if (document.getElementById('cfm').hidden) return;
  if (e.key === 'Escape') { e.preventDefault(); answerCfm(false); }
  else if (e.key === 'Enter') { e.preventDefault(); answerCfm(true); }
});

/* ---------- 启动 ---------- */
render();
</script>
